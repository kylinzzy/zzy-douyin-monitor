<!DOCTYPE html>
<html lang='zh-CN'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>张真源 · 微博 · 数据月刊</title>
<style>
:root{
--g:#16a34a;--gd:#157a3a;--gl:#22c55e;--gxl:#f1faf4;--gxx:#ffffff;
/* 张真源应援深绿：H1/H2/KPI 大数字等主要文字统一用 --ink（深绿） */
--ink:#14532d;--ink-deep:#0a3d24;--ink-mid:#1f5e3a;
--muted:#4a7060;--muted2:#7a9a8c;
--paper:#faf8f3;--rule:#1a1a1a;--rule2:#e6e3dc;--rule3:#c9c4b8;
/* 暖橘点缀（应援海报里的补丁色，仅作 motto / 编号等小标记用） */
--accent-warm:#c2410c;
--bd:rgba(20,124,58,.10);--bd2:rgba(20,124,58,.20);
--shadow:0 1px 2px rgba(16,58,43,.04),0 10px 30px rgba(16,58,43,.07);
--shadow-sm:0 1px 2px rgba(16,58,43,.05);
--shadow-lg:0 2px 6px rgba(16,58,43,.06),0 24px 50px rgba(16,58,43,.12);
--radius:20px;--radius-sm:13px;
--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSongti-SC-Regular","SimSun","宋体",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
html,body{font-family:var(--ff);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
line-height:1.55;background:var(--paper);background-attachment:fixed;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;}

/* 顶部导航 */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.7);
backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
border-bottom:1px solid var(--bd);box-shadow:0 1px 0 rgba(255,255,255,.6);}
.nav-in{max-width:1080px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;
justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px;color:var(--gd);font-size:16px;}
.brand .logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--gl),var(--gd));
color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
box-shadow:0 6px 14px rgba(22,163,74,.3);}
.nav-links{display:flex;gap:5px;align-items:center;}
.nav-links a{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gd);transition:.2s;}
.nav-links a:hover{background:rgba(22,163,74,.1);}
.nav-links a.active{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;
box-shadow:0 6px 16px rgba(22,163,74,.28);}
.nav-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.nav-status .dot-live{width:8px;height:8px;border-radius:50%;background:var(--gl);
box-shadow:0 0 0 4px rgba(34,197,94,.16);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.18);}50%{box-shadow:0 0 0 6px rgba(34,197,94,.06);}}

/* 容器与区块 */
.wrap{max-width:980px;margin:0 auto;padding:24px 22px 56px;}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:48px 0 18px;
padding-top:30px;border-top:1px solid var(--rule);}
.section-h h2{font-family:var(--serif);font-size:26px;color:var(--ink);font-weight:700;letter-spacing:-.2px;line-height:1.2;}
.section-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:5px;letter-spacing:.2px;}
.hr-title{font-size:15px;color:var(--gd);font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:9px;}
.hr-title::before{content:"";width:4px;height:16px;border-radius:3px;
background:linear-gradient(var(--gl),var(--gd));display:inline-block;}

/* 卡片 */
.card{background:var(--gxx);border:1px solid var(--bd);border-radius:var(--radius);
box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
font-family:var(--ff);font-weight:600;font-size:13px;padding:10px 18px;border-radius:999px;
border:1px solid var(--rule);cursor:pointer;transition:.2s;white-space:nowrap;background:transparent;color:var(--ink);}
.btn:hover{background:var(--ink);color:#fff;}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-primary:hover{background:var(--g);border-color:var(--g);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule);}
.btn:disabled{opacity:.55;cursor:not-allowed;}

/* 表单 */
.field{width:100%;padding:14px 16px;border:1px solid var(--bd2);border-radius:var(--radius-sm);
font-size:14px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:.18s;}
.field:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(22,163,74,.12);}
.field::placeholder{color:#a8bbb0;}

/* 标签 / 徽标 */
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;
font-weight:700;line-height:1.5;letter-spacing:.3px;}
.badge-soft{background:rgba(22,163,74,.1);color:var(--gd);}
.badge-line{border:1px solid var(--bd2);color:var(--gd);}
.badge-g{background:var(--g);color:#fff;}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:13px 14px;color:var(--muted);font-weight:600;font-size:11.5px;
letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--bd);}
.tbl td{padding:13px 14px;border-bottom:1px solid rgba(20,124,58,.07);vertical-align:middle;}
.tbl tbody tr{transition:.15s;}
.tbl tbody tr:hover{background:rgba(22,163,74,.05);}
.tbl a{color:var(--ink);font-weight:600;}
.tbl a:hover{color:var(--gd);text-decoration:underline;}
.rk{color:var(--gd);font-weight:800;width:46px;}

/* 提示框 / 空态 */
.box{background:var(--gxl);border:1px solid var(--bd);border-radius:var(--radius-sm);padding:16px 18px;
font-size:14px;line-height:1.65;}
.box.err{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
.empty{text-align:center;color:var(--muted);padding:46px 16px;font-size:13.5px;}
.muted{color:var(--muted);font-size:12px;}
.foot{text-align:center;color:var(--muted2);font-size:12px;margin-top:40px;letter-spacing:.4px;}

/* 动效 */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeArea{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .6s ease both;}
.fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;}
.dy-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease forwards;}
.dy-area{opacity:0;animation:fadeArea 1s ease .25s forwards;}

/* 响应式 */
@media (max-width:760px){
.wrap{padding:16px 14px 38px;}
.nav-in{padding:11px 14px;gap:10px;}
.nav-status{display:none;}
.nav-links a{padding:7px 12px;font-size:12.5px;}
.section-h{flex-direction:column;align-items:flex-start;gap:8px;margin:30px 0 14px;}
}
@media (max-width:480px){
.nav-links a.extra{display:none;}
}

/* ---- 时间筛选（pl-range / ov-range） ---- */
.pl-range,.ov-range{display:flex;gap:6px;align-items:center;}
.pl-range button,.ov-range button{border:1px solid var(--bd2);background:#fff;color:var(--gd);
font-weight:600;font-size:12px;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:var(--ff);transition:.18s;}
.pl-range button:hover,.ov-range button:hover{background:rgba(22,163,74,.08);}
.pl-range button.active,.ov-range button.active{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border-color:var(--g);}
.ed-range-row{display:flex;align-items:center;gap:14px;margin:18px 0 6px;}
.ed-range-row .lab{font-size:11px;letter-spacing:1.6px;color:var(--gd);font-weight:700;text-transform:uppercase;}

/* ---- 作品表格（抖音） ---- */
.wt-frame{max-height:520px;overflow:auto;border:1px solid var(--bd);border-radius:var(--radius);background:#fff;}
.wt-table{width:100%;border-collapse:collapse;font-size:12.5px;font-feature-settings:"tnum";}
.wt-table thead th{position:sticky;top:0;background:var(--gxl);color:var(--gd);
font-weight:700;padding:10px 14px;border-bottom:1px solid var(--bd2);font-size:11.5px;white-space:nowrap;z-index:1;}
.wt-table thead th.sticky-l{left:0;z-index:2;}
.wt-table tbody td{padding:9px 14px;border-bottom:1px solid var(--bd);color:var(--ink);white-space:nowrap;}
.wt-table tbody td.sticky-l{position:sticky;left:0;background:#fff;box-shadow:1px 0 0 var(--bd);z-index:0;}
.wt-table tbody tr:hover td{background:rgba(22,163,74,.04);}
.wt-table tbody tr:hover td.sticky-l{background:#f0fdf4;}
.wt-title{color:var(--ink);font-weight:600;max-width:220px;display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
.wt-title:hover{color:var(--gd);text-decoration:underline;}

/* ---- 单集百万节点 ---- */
.ms-frame{max-height:520px;overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:6px 22px;}
.ms-empty{padding:36px;text-align:center;color:var(--muted);font-size:13px;}
.ms-group{padding:16px 0;border-bottom:1px dashed var(--bd);}
.ms-group:last-child{border-bottom:none;}
.ms-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);margin-bottom:9px;}
.ms-title a:hover{color:var(--gd);text-decoration:underline;}
.ms-items{display:flex;flex-direction:column;gap:7px;padding-left:6px;}
.ms-row{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;font-size:13px;color:var(--ink);}
.ms-dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.18);}
.ms-val{font-weight:600;font-feature-settings:"tnum";}
.ms-time{color:var(--muted);font-feature-settings:"tnum";font-size:12.5px;}
.ms-row.new .ms-dot{background:var(--g);box-shadow:0 0 0 4px rgba(22,163,74,.28);animation:pulse 2s ease-in-out infinite;}
.ms-new{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;
background:rgba(22,163,74,.12);color:var(--gd);font-size:11px;font-weight:700;vertical-align:middle;}

/* ---- 作品表格（增强：可排序表头 + 紧凑下载按钮） ---- */
.wt-table thead th.sortable{cursor:pointer;transition:background .15s,color .15s;
position:sticky;top:0;}
.wt-table thead th.sortable:hover{background:var(--gl);color:var(--ink);}
.wt-table thead th .sort-ind{display:inline-block;width:11px;margin-left:4px;
color:var(--muted);font-size:9px;font-weight:700;vertical-align:1px;}
.wt-table thead th.sort-asc,.wt-table thead th.sort-desc{background:var(--gl);color:var(--ink);}
.wt-table thead th.sort-asc .sort-ind,.wt-table thead th.sort-desc .sort-ind{color:var(--accent-warm);}

/* 紧凑下载按钮（嵌入表头） */
.xlsx-mini{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;
border:1px solid var(--bd2);border-radius:18px;background:var(--gxl);
color:var(--ink);font-family:var(--serif);font-size:11.5px;font-weight:600;
letter-spacing:.5px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;
white-space:nowrap;}
.xlsx-mini:hover{background:var(--gl);border-color:var(--gd);color:var(--gd);}
.xlsx-mini svg{width:12px;height:12px;fill:currentColor;flex:none;}
.xlsx-mini.disabled{opacity:.4;pointer-events:none;}

/* ---- 单集百万节点（标签云 4 列 · 紧凑版） ---- */
/* 覆盖老 .ms-group 的 padding:16px 0（那个让组之间空 50px+ 的元凶） */
.ms-group{padding:0;margin-bottom:5px;border-bottom:none;}
.ms-group:last-child{margin-bottom:0;}
.ms-title{font-family:var(--serif);font-size:11.5px;font-weight:600;
color:var(--ink);margin:0 0 4px;padding-bottom:3px;border-bottom:.5px dashed var(--rule);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-title a:hover{color:var(--gd);text-decoration:underline;}
.ms-group a{color:var(--ink);}
.ms-group a:hover{color:var(--gd);}

.ms-tags{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 6px;padding:2px 0;}
.ms-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;
background:var(--gxl);border:1px solid var(--bd);border-radius:9px;
font-size:10.5px;color:var(--ink);font-feature-settings:"tnum";
font-family:var(--ff);transition:background .15s,border-color .15s,color .15s;
white-space:nowrap;min-width:0;line-height:1.6;}
.ms-tag:hover{background:var(--g);color:#fff;border-color:var(--g);}
.ms-tag .ms-num{font-weight:700;color:var(--gd);font-size:11px;}
.ms-tag .ms-date{color:#888;font-size:9.5px;}
.ms-tag:hover .ms-num,.ms-tag:hover .ms-date{color:#fff;}
.ms-tag.new{background:rgba(255,107,53,.06);border-color:var(--accent-warm);}
.ms-tag.new .ms-new{display:inline-block;font-size:8px;font-weight:700;color:var(--accent-warm);
background:rgba(255,107,53,.14);padding:0 4px;border-radius:5px;margin-left:2px;line-height:1.5;}

/* 覆盖 .ms-frame 原 padding:6px 22px → 紧凑 */
.ms-frame{padding:6px 14px;}

@media (max-width:760px){
  .ms-tags{grid-template-columns:repeat(2,minmax(0,1fr));}
}
.ed-masthead{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:18px;
padding:34px 0 18px;border-bottom:1.2px solid var(--rule);}
.ed-masthead .lt{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink-deep);
letter-spacing:-.2px;}
.ed-masthead .rt{font-size:10.5px;letter-spacing:2.2px;color:#666;text-align:right;
text-transform:uppercase;}
.ed-masthead .rt b{color:var(--accent-warm);font-weight:700;}
/* 顶部口号 "ALL FOR ZZY"：衬线暖橘小字，张真源应援口号的杂志式呈现 */
.ed-masthead .motto{position:absolute;left:0;top:10px;font-family:var(--serif);font-size:10.5px;
letter-spacing:3.6px;color:var(--accent-warm);font-weight:600;text-transform:uppercase;
display:flex;align-items:center;gap:10px;margin:0;line-height:1;}
.ed-masthead .motto::before{content:"";display:inline-block;width:22px;height:1px;background:var(--accent-warm);}
.ed-masthead .motto::after{content:"";display:inline-block;width:42px;height:1px;background:var(--accent-warm);opacity:.35;}
/* masthead 右上角：白色蝴蝶剪影 + 颗粒光点（低饱和深绿，不抢主文字） */
.ed-masthead .deco{position:absolute;right:0;top:0;width:148px;height:42px;pointer-events:none;}
.ed-masthead .deco .bf{position:absolute;right:0;top:0;width:78px;color:var(--ink-mid);opacity:.20;}
.ed-masthead .deco .sd{position:absolute;right:74px;top:10px;width:64px;color:var(--ink-mid);opacity:.55;}
.ed-masthead .deco svg{display:block;fill:currentColor;}
.ed-vol{font-size:11px;letter-spacing:2.6px;color:#888;margin-top:14px;text-transform:uppercase;}
.ed-vol b{color:var(--ink);font-weight:700;}

.ed-stat{position:relative;margin:48px 0 12px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;
padding-bottom:18px;border-bottom:1px solid var(--rule2);}
/* ed-stat 右上角：极小蝴蝶剪影，仅装饰 */
.ed-stat .deco{position:absolute;right:0;top:0;width:36px;height:18px;
color:var(--ink-mid);opacity:.16;pointer-events:none;}
.ed-stat .deco svg{display:block;width:100%;height:auto;fill:currentColor;}
.ed-stat .label{font-size:11px;letter-spacing:2.6px;color:var(--g);font-weight:700;
margin-bottom:14px;text-transform:uppercase;}
.ed-stat .num{font-family:var(--serif);font-size:clamp(56px,8vw,108px);font-weight:700;
color:var(--ink);letter-spacing:-2px;line-height:.95;font-feature-settings:"tnum";}
.ed-stat .num .raw{font-family:var(--ff);font-size:13px;color:#888;font-weight:500;
margin-left:12px;letter-spacing:0;vertical-align:middle;}
.ed-stat .sub{font-size:13px;color:#666;margin-top:14px;letter-spacing:.3px;}
.ed-stat .meta{text-align:right;font-size:11px;letter-spacing:1.5px;color:#666;
text-transform:uppercase;line-height:1.9;}
.ed-stat .meta b{color:var(--g);font-weight:700;font-family:var(--serif);
font-size:14px;letter-spacing:-.2px;text-transform:none;}

.ed-rule{height:1px;background:var(--rule);margin:0 0 36px;opacity:.92;}

.ed-charts{display:grid;grid-template-columns:1fr;gap:42px;}
.ed-chart .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);
margin-bottom:6px;letter-spacing:-.1px;}
.ed-chart .sub{font-size:10.5px;letter-spacing:1.8px;color:#888;margin-bottom:18px;
text-transform:uppercase;}
.ed-chart .frame{padding:10px 0 12px;border-bottom:.5px solid var(--rule);}

.ed-pub{margin-top:36px;padding:18px 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);}
.ed-pub .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.1px;}
.ed-pub .sub{font-size:10.5px;letter-spacing:1.8px;color:#888;margin-bottom:14px;text-transform:uppercase;}
.ed-pub .frame{padding:6px 0 12px;}

.ed-list{margin:0;padding:0;}
.ed-list-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule);}
.ed-list-head .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.1px;}
.ed-list-head .meta{font-size:10.5px;letter-spacing:1.8px;color:#888;text-transform:uppercase;}
.ed-list .row{display:grid;grid-template-columns:46px 1fr 120px 84px;gap:18px;
align-items:baseline;padding:13px 0;border-bottom:.5px solid var(--rule2);
transition:background .18s;}
.ed-list .row:hover{background:rgba(22,163,94,.04);}
.ed-list .no{font-family:var(--serif);font-size:13px;font-style:italic;color:#888;
font-weight:500;letter-spacing:.5px;}
.ed-list .title{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);
letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
display:block;}
.ed-list .title:hover{color:var(--g);}
.ed-list .time{font-size:11.5px;color:#666;letter-spacing:.3px;font-feature-settings:"tnum";}
.ed-list .nums{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--g);
text-align:right;font-feature-settings:"tnum";}
.ed-list-foot{padding:14px 0 0;font-size:10.5px;letter-spacing:1.8px;color:#888;text-align:center;}

/* 无后端时 nav/backend 按钮的禁用样式：仅变灰 + tooltip，不替换 DOM */
.nav-links a.disabled,.ed-xlsx-btn.disabled{
  opacity:.32;cursor:not-allowed;color:var(--muted);pointer-events:none;
}

/* 作品缩略图矩阵 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px;margin-top:14px;}
.wt{position:relative;display:block;aspect-ratio:3/4;border-radius:13px;overflow:hidden;
background:var(--gxl);border:1px solid var(--bd);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;}
.wt:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.wt.miss{background:linear-gradient(135deg,var(--gl),var(--gd));}
.wt img{width:100%;height:100%;object-fit:cover;display:block;}
.wt .scrim{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;
background:linear-gradient(transparent,rgba(10,61,36,.82));pointer-events:none;}
.wt .lk{display:flex;align-items:center;gap:3px;color:#fff;font-family:var(--serif);
font-weight:700;font-size:12.5px;font-feature-settings:"tnum";line-height:1;}
.wt .lk svg{width:10px;height:10px;fill:#fff;opacity:.92;flex:none;}
.wt .ti{margin-top:3px;font-size:10px;line-height:1.3;color:rgba(255,255,255,.85);
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wt .mt-badge{position:absolute;left:7px;top:7px;z-index:2;background:var(--ink-deep);

  var PLATFORM = (window.INITIAL_DATA && window.INITIAL_DATA.platform) || "weibo";
  var IS_XHS = PLATFORM === "xhs";
  var LABELS = IS_XHS ? {
    pageTitle: "小红书数据月刊",
    kpiMainEn: "VIEWS",        kpiMainCn: "浏览量",   kpiMainSub: "话题总浏览量",
    kpiSubEn:  "DISCUSSIONS",  kpiSubCn:  "讨论量",   kpiSubSub:  "话题总讨论量 · 含点赞 / 评论 / 收藏",
    exportTitle: "张真源 · 小红书数据月刊 — 数据导出",
    exportMain: "浏览量", exportSub: "讨论量",
    exportTrendSheet: "浏览讨论趋势",
    exportTrendHeader: ["时间", "浏览量", "浏览增量", "讨论量"],
    exportFile: "张真源_小红书作品_"
  } : {
    pageTitle: "微博数据月刊",
    kpiMainEn: "FOLLOWERS",       kpiMainCn: "粉丝",     kpiMainSub: "粉丝总数",
    kpiSubEn:  "TOTAL ENGAGEMENT", kpiSubCn:  "累计转评评", kpiSubSub:  "累计转评评总数 · 含转发 / 评论 / 点赞",
    exportTitle: "张真源 · 微博数据月刊 — 数据导出",
    exportMain: "粉丝数", exportSub: "累计转评评",
    exportTrendSheet: "粉丝转评评趋势",
    exportTrendHeader: ["时间", "粉丝数", "粉丝增量", "累计转评评"],
    exportFile: "张真源_微博作品_"
  };

  // ---------------- 工具函数（与 dashboard.js 一致） ----------------
  function humanize(n) {
    n = parseFloat(n);
    if (n === null || n === undefined || isNaN(n)) return "-";
    var a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(2) + "亿";
    if (a >= 1e4) return (n / 1e4).toFixed(1) + "万";
    if (a >= 1e3) return Math.round(n).toLocaleString("en-US");
    return (Number.isInteger(n) ? n.toFixed(0) : n.toFixed(1));
  }
  function fmtNum(v) {
    v = parseFloat(v);
    if (isNaN(v)) return String(v);
    if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(2) + "亿";
    if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + "万";
    if (Number.isInteger(v)) return String(v);
    return v.toFixed(2);
  }
  function fmtTsFull(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fmtSigned(n) {
    if (n > 0) return "+" + humanize(n);
    if (n < 0) return humanize(n);
    return "±0";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function videoUrl(id) { return "https://www.douyin.com/video/" + id; }
  function boardUrl(name) {
    return "https://www.douyin.com/search/" + encodeURIComponent(name) + "?type=challenge";
  }
  var BOARD_LABEL = {
    view_count: "播放", user_count: "参与", video_count: "视频",
    hot_value: "热度", search_count: "搜索", discussion_count: "讨论",
    read_count: "阅读量", discuss_count: "讨论量"
  };
  function boardExtraStr(extra) {
    if (!extra || typeof extra !== "object") return "";
    var keys = ["view_count", "user_count", "video_count"];
    for (var k in extra) { if (extra.hasOwnProperty(k) && keys.indexOf(k) < 0) keys.push(k); }
    var parts = [];
    for (var i = 0; i < keys.length; i++) {
      var v = extra[keys[i]];
      if (v == null || v === 0) continue;
      // 已带「万 / 亿」单位的字符串直接显示，不重复格式化
      if (typeof v === "string" && /[万亿]/.test(v)) {
        parts.push((BOARD_LABEL[keys[i]] || keys[i]) + " " + v);
      } else {
        parts.push((BOARD_LABEL[keys[i]] || keys[i]) + " " + fmtNum(v));
      }
    }
    return parts.join(" · ");
  }

  // ---------------- SVG 折线图（与 dashboard.js 完全一致） ----------------
  function svgLine(xlabels, values, opts) {
    opts = opts || {};
    var color = opts.color || GREEN_D;
    var w = opts.w || 560, h = opts.h || 240;
    var log = !!opts.log, relative_start = !!opts.relative_start;
    var point_titles = opts.point_titles, point_hrefs = opts.point_hrefs;
    var point_meta = opts.point_meta;
    var point_labels = opts.point_labels;
    var chart_id = opts.chart_id;
    var n = values.length;
    if (n === 0)
      return '<svg viewBox="0 0 ' + w + ' ' + h + '"><text x="' + (w / 2) +
        '" y="' + (h / 2) + '" text-anchor="middle" fill="' + MUTED + '" font-size="13">暂无数据</text></svg>';

    var base = values[0];
    if (relative_start && n > 0) values = values.map(function (v) { return v - base; });

    var pad_l = 56, pad_r = 14, pad_t = 16, pad_b = 34;
    var plot_w = w - pad_l - pad_r, plot_h = h - pad_t - pad_b;
    var bottom = pad_t + plot_h;
    var xs = (n === 1) ? [pad_l + plot_w / 2]
      : values.map(function (_, i) { return pad_l + i * (plot_w / (n - 1)); });

    var vmin = Math.min.apply(null, values), vmax = Math.max.apply(null, values);
    var yf, yticks, lo, hi;
    if (log) {
      lo = Math.floor(Math.log10(Math.max(vmin, 1)));
      hi = Math.ceil(Math.log10(Math.max(vmax, 1)));
      if (hi === lo) hi = lo + 1;
      yf = function (v) { var lv = Math.log10(Math.max(v, 1)); return pad_t + plot_h - (lv - lo) / (hi - lo) * plot_h; };
      yticks = []; for (var e = lo; e <= hi; e++) yticks.push(Math.pow(10, e));
    } else {
      if (relative_start) {
        var span = Math.max(Math.abs(vmin), Math.abs(vmax)) || 1;
        hi = span * 1.15; lo = -span * 1.15;
        yf = function (v) { return pad_t + plot_h - ((v - lo) / (hi - lo)) * plot_h; };
        yticks = [-span, -span / 2, 0, span / 2, span];
      } else {
        hi = (vmax * 1.12) || 1; lo = 0;
        yf = function (v) { return pad_t + plot_h - (v / hi) * plot_h; };
        yticks = [0, hi * 0.25, hi * 0.5, hi * 0.75, hi];
      }
    }

    var pts = values.map(function (v, i) { return [xs[i], yf(v)]; });
    var line = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + " " + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = line + " L " + pts[n - 1][0].toFixed(1) + " " + bottom.toFixed(1) +
      " L " + pts[0][0].toFixed(1) + " " + bottom.toFixed(1) + " Z";

    var grid = [];
    for (var g = 0; g < yticks.length; g++) {
      var tv = yticks[g], y = yf(tv);
      grid.push('<line x1="' + pad_l + '" x2="' + (pad_l + plot_w) + '" y1="' + y.toFixed(1) +
        '" y2="' + y.toFixed(1) + '" stroke="' + BORDER + '" stroke-dasharray="2,3"/>');
      var label;
      if (relative_start) label = (tv === 0) ? "0" : (tv > 0 ? "+" + fmtNum(tv) : "−" + fmtNum(-tv));
      else label = fmtNum(tv);
      grid.push('<text x="' + (pad_l - 7).toFixed(1) + '" y="' + y.toFixed(1) +
        '" text-anchor="end" font-size="10" fill="' + MUTED + '" dominant-baseline="middle">' + label + '</text>');
    }
    var xt = [];
    var step = Math.max(1, Math.floor(n / 7));
    for (var xi = 0; xi < n; xi += step) {
      xt.push('<text x="' + xs[xi].toFixed(1) + '" y="' + (bottom + 18).toFixed(1) +
        '" text-anchor="middle" font-size="10" fill="' + MUTED + '">' + esc(xlabels[xi]) + '</text>');
    }
    if (n > 1 && (n - 1) % step !== 0) {
      xt.push('<text x="' + xs[n - 1].toFixed(1) + '" y="' + (bottom + 18).toFixed(1) +
        '" text-anchor="middle" font-size="10" fill="' + MUTED + '">' + esc(xlabels[n - 1]) + '</text>');
    }
    var zero_line = "";
    if (relative_start) {
      var y0 = yf(0);
      zero_line = '<line x1="' + pad_l + '" x2="' + (pad_l + plot_w) + '" y1="' + y0.toFixed(1) +
        '" y2="' + y0.toFixed(1) + '" stroke="' + color + '" stroke-width="1" stroke-opacity="0.35"/>';
    }
    var dots = [];
    var titles = (point_titles && point_titles.length === n) ? point_titles : null;
    var hrefs = (point_hrefs && point_hrefs.length === n) ? point_hrefs : null;
    var meta = (point_meta && point_meta.length === n) ? point_meta : null;
    var labels = (point_labels && point_labels.length === n) ? point_labels : null;
    for (var di = 0; di < n; di++) {
      var x = pts[di][0], y = pts[di][1];
      var is_last = (di === n - 1);
      var hit = '<rect x="' + (x - 12).toFixed(1) + '" y="' + (y - 12).toFixed(1) + '" width="24" height="24" fill="transparent" pointer-events="all"/>';
      var labelText = "";
      if (labels && labels[di]) {
        var ly = is_last ? (y - 13) : (y - 9);
        labelText = '<text x="' + x.toFixed(1) + '" y="' + ly.toFixed(1) +
          '" text-anchor="middle" font-size="9" font-weight="700" fill="' + color +
          '" pointer-events="none" font-family="var(--ff)" font-feature-settings="\'tnum\' 1">' +
          esc(labels[di]) + '</text>';
      }
      var inner;
      if (is_last) {
        inner = hit + labelText +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="9" fill="' + color + '" fill-opacity="0.12" pointer-events="none"/>' +
          '<circle class="pt" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4.5" fill="' + color + '" stroke="#fff" stroke-width="2" pointer-events="none"/>';
      } else {
        inner = hit + labelText +
          '<circle class="pt" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="#fff" stroke="' + color + '" stroke-width="2" pointer-events="none"/>';
      }
      var md = meta ? meta[di] : null;
      var gattrs = ' data-i="' + di + '"';
      if (md) {
        if (md.title) gattrs += ' data-tt="' + esc(md.title) + '"';
        if (md.digg != null) gattrs += ' data-dg="' + esc(md.digg) + '"';
        if (md.date) gattrs += ' data-dt="' + esc(md.date) + '"';
        if (md.href) gattrs += ' data-href="' + esc(md.href) + '"';
        if (md.sub) gattrs += ' data-sub="' + esc(md.sub) + '"';
      } else {
        if (titles && titles[di]) gattrs += ' data-tt="' + esc(titles[di].replace(/\n/g, " · ")) + '"';
        if (hrefs && hrefs[di]) gattrs += ' data-href="' + esc(hrefs[di]) + '"';
      }
      if (hrefs && hrefs[di]) {
        var safe = String(hrefs[di]).replace(/"/g, "&quot;");
        dots.push('<g' + gattrs + '><a href="' + safe + '" target="_blank" rel="noopener">' + inner + '</a></g>');
      } else {
        dots.push('<g' + gattrs + '>' + inner + '</g>');
      }
    }
    var id_attr = chart_id ? ' id="' + chart_id + '"' : "";
    return '<svg' + id_attr + ' viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:' + h + 'px">' +
      grid.join("") + xt.join("") + zero_line +
      '<path class="dy-area" d="' + area + '" fill="' + color + '" fill-opacity="0.10"/>' +
      '<path class="dy-line" d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/>' +
      dots.join("") + '</svg>';
  }

  // ---------------- 作品缩略图卡（含破百万标签） ----------------
  function workThumb(c) {
    var title = (c.desc || "").slice(0, 40) || (c.aweme_id || "").slice(0, 8);
    if (c.co && c.co_author) title = "与" + c.co_author + "共创 · " + title;
    var url = videoUrl(c.aweme_id);
    var cover = c.cover || "";
    var likes = humanize(c.digg);
    var cur = c.cur_digg || 0;
    var max_tier = Math.floor(cur / 1000000);
    var mt_badge = "", mt_time = "";
    if (max_tier >= 1) {
      var mtimes = c.mtimes || {};
      var top_ts = null;
      for (var t = max_tier; t >= 1; t--) {
        if (mtimes[t] != null) { top_ts = mtimes[t]; break; }
      }
      mt_time = top_ts ? fmtTsFull(top_ts) : "已达成";
      mt_badge = '<span class="mt-badge">已破 ' + max_tier + ' 百万</span>';
    }
    var heart = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M12 21s-7.5-4.9-10-9.2C.4 8.3 2 4.8 5.3 4.8c2 0 3.3 1.1 4.2 2.4 ' +
      'C10.4 5.9 11.7 4.8 13.7 4.8c3.3 0 4.9 3.5 3.3 6.9C19.5 16.1 12 21 12 21z"/></svg>';
    var img = "";
    if (cover) {
      img = '<img src="' + esc(cover) + '" alt="" loading="eager" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'miss\')">';
    }
    var co_badge = c.co ? '<span class="co-badge">共创</span>' : "";
    var time_line = mt_badge ? '<div class="mt-time">' + mt_time + '</div>' : "";
    return '<a class="wt' + (cover ? "" : " miss") + '" href="' + url + '" target="_blank" rel="noopener" title="' + esc(title) + '">' +
      img + mt_badge + co_badge +
      '<div class="scrim"><div class="lk">' + heart + likes + '</div>' +
      '<div class="ti">' + esc(title) + '</div>' + time_line + '</div></a>';
  }

  // 微博单集百万节点（每 100 万点赞 → 紧凑标签云，按微博分组，按最近达成时间排序，最新标 "新"）
  function wbPostMilestonesHTML(ms) {
    if (!ms || !ms.groups || !ms.groups.length)
      return '<div class="ms-frame"><div class="ms-empty">尚无达成节点（需要点赞 ≥ 100 万的微博）</div></div>';
    var groupsHtml = ms.groups.map(function (g) {
      var tags = g.milestones.map(function (m) {
        var label = m.threshold >= 1e8
          ? (m.threshold / 1e8).toFixed(1).replace(/\.0$/, "") + "亿"
          : Math.round(m.threshold / 1e4) + "万";
        var ts = (m.reached_at || "");
        var dateText = ts.length >= 16 ? ts.slice(5, 16) : ts;
        var newBadge = m.is_new ? ' <span class="ms-new">new</span>' : "";
        return '<span class="ms-tag' + (m.is_new ? " new" : "") + '" title="' + esc(ts) + '">' +
          '<span class="ms-num">' + esc(label) + '</span>' +
          '<span class="ms-date">' + esc(dateText) + newBadge + '</span>' +
          '</span>';
      }).join("");
      var titleTxt = (g.title || "微博");
      return '<div class="ms-group">' +
        '<div class="ms-title"><a href="' + esc(g.share_url || "https://m.weibo.cn/") +
          '" target="_blank" rel="noopener" title="在微博打开">' +
          esc(titleTxt.length > 40 ? titleTxt.slice(0, 40) + "…" : titleTxt) + '</a></div>' +
        '<div class="ms-tags">' + tags + '</div></div>';
    }).join("");
    return '<div class="ms-frame">' + groupsHtml + '</div>';
  }

  // 解析「5605.5万 / 13亿 / 7338.2万」这样的字符串为整数，用于排序。
  function parseZhNum(s) {
    if (s == null) return 0;
    s = String(s).trim();
    var m = s.match(/^([\d.,]+)\s*([万亿]?)$/);
    if (!m) return 0;
    var n = parseFloat(m[1].replace(/,/g, ""));
    if (isNaN(n)) return 0;
    if (m[2] === "万") return n * 1e4;
    if (m[2] === "亿") return n * 1e8;
    return n;
  }

  // 把 extra 字典转成两个 <span class="lab">阅读量</span> X · <span class="lab">讨论量</span> Y 的可读小条
  function topicExtraHTML(extra) {
    if (!extra || typeof extra !== "object") return "";
    var parts = [];
    if (extra.read_count)      parts.push('<span class="lab">阅读量</span>' + esc(extra.read_count));
    if (extra.discuss_count)   parts.push('<span class="lab">讨论量</span>' + esc(extra.discuss_count));
    if (extra.view_count)      parts.push('<span class="lab">播放</span>' + esc(extra.view_count));
    if (extra.user_count)      parts.push('<span class="lab">参与</span>' + esc(extra.user_count));
    return parts.join('<span style="color:#bbb;margin:0 2px"> · </span>');
  }

  // ---------------- 话题 chips ----------------
  function boardChips(items, limit) {
    limit = limit || 12;
    if (!items || !items.length) return '<div class="muted">暂无数据</div>';
    // 排序：阅读量 / 播放 量降序，没数据的排在最后
    var sorted = items.slice().sort(function (a, b) {
      var ra = parseZhNum((a.extra || {}).read_count || (a.extra || {}).view_count);
      var rb = parseZhNum((b.extra || {}).read_count || (b.extra || {}).view_count);
      if (!ra && rb) return 1;
      if (ra && !rb) return -1;
      if (rb !== ra) return rb - ra;
      // 阅读量相同时用 讨论量 / 参与 降序
      var da = parseZhNum((a.extra || {}).discuss_count || (a.extra || {}).user_count);
      var db = parseZhNum((b.extra || {}).discuss_count || (b.extra || {}).user_count);
      return db - da;
    });
    var out = "";
    for (var i = 0; i < Math.min(sorted.length, limit); i++) {
      var it = sorted[i];
      var extra = topicExtraHTML(it.extra);
      var name = it.name;
      var url = it.url || boardUrl(name);
      var emptyCls = extra ? "" : " empty";
      var valueHTML = extra
        ? '<span class="v">' + extra + '</span>'
        : '<span class="v" style="color:#bbb">数据采集中</span>';
      out += '<a class="tg' + emptyCls + '" href="' + esc(url) + '" target="_blank" rel="noopener" title="在微博查看 ' + esc(name) + '"># ' +
        esc(name) + valueHTML + '</a>';
    }
    return '<div class="ed-topics-row">' + out + '</div>';
  }

  // ---------------- 辅助：时间筛选 / 作品表格 / 单集节点 ----------------
  var RANGES = { "24h": 1, "7d": 7, "30d": 30, all: 1e9 };
  var RANGE_LABEL = { "24h": "当日", "7d": "7日", "30d": "30日", all: "全部" };
  var currentRange = "7d";
  var FULL_DATA = null;

  function rangeBarHTML() {
    var items = [["24h", "当日"], ["7d", "7日"], ["30d", "30日"], ["all", "全部"]];
    return '<div class="pl-range" style="margin-left:auto">' +
      items.map(function (kv) {
        return '<button data-r="' + kv[0] + '" class="' + (kv[0] === currentRange ? "active" : "") + '">' + kv[1] + '</button>';
      }).join("") + '</div>';
  }

  function sliceByRange(arrs) {
    if (currentRange === "all" || !FULL_DATA || !FULL_DATA.labels) return arrs;
    var cut = Date.now() - (RANGES[currentRange] || 7) * 86400000;
    var keepIdx = [];
    for (var i = 0; i < FULL_DATA.labels.length; i++) {
      var t = new Date(FULL_DATA.labels[i].replace(/-/g, "/")).getTime();
      if (t >= cut) keepIdx.push(i);
    }
    if (keepIdx.length < 2) return arrs;
    return arrs.map(function (a) {
      var out = new Array(keepIdx.length);
      for (var k = 0; k < keepIdx.length; k++) out[k] = a[keepIdx[k]];
      return out;
    });
  }

  function regenTrendCharts() {
    if (!FULL_DATA || !FULL_DATA.labels || !FULL_DATA.labels.length) return;
    var labels = FULL_DATA.labels;
    var fansVals = FULL_DATA.followers || [];
    var likedVals = FULL_DATA.liked || [];
    var sliced = sliceByRange([labels.slice(), fansVals.slice(), likedVals.slice()]);
    var lbl = sliced[0], fv = sliced[1], lv = sliced[2];
    var xs = lbl.map(function (l) { return (l.indexOf(" ") >= 0) ? l.split(" ")[0].slice(5) : l; });
    var fansTitles = lbl.map(function (l, i) {
      return l + "\n粉丝 " + humanize(fv[i]) + "（" + fmtSigned(fv[i] - fv[0]) + "）";
    });
    var likedTitles = lbl.map(function (l, i) {
      return l + "\n转评评 " + humanize(lv[i]) + "（" + fmtSigned(lv[i] - lv[0]) + "）";
    });
    var c_fans = svgLine(xs, fv, { color: GREEN_D, relative_start: true, point_titles: fansTitles, chart_id: "chart-fans" });
    var c_liked = svgLine(xs, lv, { color: GREEN_BR, relative_start: true, point_titles: likedTitles, chart_id: "chart-liked" });
    var fe = document.getElementById("chart-fans-frame");
    var le = document.getElementById("chart-liked-frame");
    if (fe) fe.innerHTML = c_fans;
    if (le) le.innerHTML = c_liked;
  }

  function milestonesHTML(ms) {
    if (!ms || !ms.groups || !ms.groups.length)
      return '<div class="ms-frame"><div class="ms-empty">尚无达成节点（需要粉丝每增长 50 万）</div></div>';
    var groupsHtml = ms.groups.map(function (g) {
      var tags = g.milestones.map(function (m) {
        var label = m.threshold >= 1e8
          ? (m.threshold / 1e8).toFixed(1).replace(/\.0$/, "") + "亿"
          : Math.round(m.threshold / 1e4) + "万";
        var ts = (m.reached_at || "");

  // ---------------- 微博数据 → 抖音形状 ----------------
  function transform(d) {
    var main = d.points_main || [];

    var labels = [], followers = [], liked = [], fdelta = [];
    for (var i = 0; i < n; i++) {
      labels.push(fmtTsFull(main[i].t));
      followers.push(+main[i].v);
      liked.push(+sub[i].v);
    }
    for (var j = 0; j < followers.length; j++) {
      fdelta.push(j > 0 ? followers[j] - followers[j - 1] : 0);
    }
    var ms = d.milestones_main || { groups: [] };
    var groups = (ms.groups || []).map(function (g) {
      return {
        title: g.title,
        share_url: d.url,
        milestones: (g.milestones || []).map(function (m) {
          return {
            threshold: m.threshold,
            reached_at: m.reached_at,

          };
        })
      };
    });
    var milestones = {
      groups: groups,
      metric_label: ms.metric_label || "粉丝",
      step: ms.step || 500000,
      newest_at: ms.newest_at
    };
    // 超话趋势

    var posts = d.posts || [];

      return { name: t.title, url: t.scheme || "", extra: extra };

    return {
      head: { nickname: "张真源", profile_url: d.url, avatar_url: "", sec_uid: "" },
      labels: labels, followers: followers, liked: liked, followers_delta: fdelta,
      post_count: posts.length, post_cards: [], publish: [],

  var POST_SORT = { key: "created_at", dir: "desc" };

  // ---------------- 客户端导出 Excel ----------------
  function ensureXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function (resolve, reject) {
      var urls = [
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
        "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"
      ];
      var i = 0;
      function tryLoad() {
        if (i >= urls.length) { reject(new Error("无法加载 Excel 库")); return; }
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = function () { window.XLSX ? resolve(window.XLSX) : tryLoad(); };
        s.onerror = tryLoad;
        document.head.appendChild(s);
      }
      tryLoad();
    });
  }
  function exportXlsx() {
    var d = LATEST_DATA || window.INITIAL_DATA;
    if (!d) { alert("暂无数据，无法导出"); return; }
    var btn = document.getElementById("edXlsxBtn");
    var old = btn ? btn.textContent : "";
    if (btn) { btn.textContent = "生成中…"; btn.classList.add("disabled"); }
    ensureXLSX().then(function (XLSX) {
      var head = d.head || {};
      var nick = head.nickname || "张真源";
      var followers = d.followers || [], likedV = d.liked || [], fd = d.followers_delta || [], labels = d.labels || [];
      var fans = followers.length ? followers[followers.length - 1] : 0;
      var liked = likedV.length ? likedV[likedV.length - 1] : 0;
      var lastUpdate = labels.length ? labels[labels.length - 1] : "—";
      var now = new Date();
      var pad = function (x) { return (x < 10 ? "0" : "") + x; };
      var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "_" + pad(now.getHours()) + pad(now.getMinutes());

      var overview = [
        [LABELS.exportTitle],
        ["导出时间", fmtTsFull(Math.floor(Date.now() / 1000))],
        ["账号", nick],
        IS_XHS ? ["话题", (d.topic && d.topic.url) || ""] : ["微博号", PUBLIC_ID],
        [LABELS.exportMain, fans],
        [LABELS.exportSub, liked],
        ["作品数", d.post_count || 0],
        ["最近更新", lastUpdate]
      ];
      var trend = [LABELS.exportTrendHeader];
      for (var i = 0; i < labels.length; i++) {
        var inc = (i > 0 && followers[i - 1] != null) ? (followers[i] - followers[i - 1]) : (fd[i] != null ? fd[i] : 0);
        trend.push([labels[i], followers[i] != null ? followers[i] : "", inc, likedV[i] != null ? likedV[i] : ""]);
      }
      var topics = [["排名", "名称", "播放", "参与", "视频"]];
      var tp = (d.boards && d.boards.topic) || [];
      for (var t = 0; t < tp.length; t++) {
        var it = tp[t], ex = it.extra || {};
        topics.push([it.rank, it.name, ex.view_count || 0, ex.user_count || 0, ex.video_count || 0]);
      }

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(overview), "概览");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(trend), LABELS.exportTrendSheet);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(topics), "话题");
      var safe = (nick || "张真源").replace(/[^\w一-龥\-_]/g, "_").slice(0, 30) || "weibo";
      XLSX.writeFile(wb, safe + "_数据_" + ts + ".xlsx");
    }).catch(function (err) {
      alert("Excel 导出失败：" + (err && err.message ? err.message : err) + "\n（需可访问 cdn.jsdelivr.net 加载导出库）");
    }).then(function () {
      if (btn) { btn.textContent = old; btn.classList.remove("disabled"); }
    });
  }

  // 超话每日数据 → Excel（按采集日期每日一行）
  function exportSuperDailyXlsx() {
    var d = LATEST_DATA || window.INITIAL_DATA;
    if (!d) { alert("暂无数据，无法导出"); return; }
    var btn = document.getElementById("superDailyXlsxBtn");
    var old = btn ? btn.textContent : "";
    if (btn) { btn.textContent = "生成中…"; btn.classList.add("disabled"); }
    ensureXLSX().then(function (XLSX) {
      var rows = (d && d.super_topic_daily) || [];
      if (!rows.length) throw new Error("暂无每日数据");
      var head = ["日期", "真知棒", "帖子", "今日签到", "签到排名"];
      var aoa = [head];
      rows.forEach(function (r) {
        aoa.push([r.date || "", r["真知棒"] || "", r["帖子"] || "",
                  r["今日签到"] || "", r["签到排名"] || ""]);
      });
      var wb = XLSX.utils.book_new();
      var sheet = XLSX.utils.aoa_to_sheet(aoa);
      sheet['!cols'] = [{wch:12},{wch:10},{wch:12},{wch:12},{wch:10}];
      XLSX.utils.book_append_sheet(wb, sheet, "超话每日数据");
      var ts = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, "超话每日数据_" + ts + ".xlsx");
    }).catch(function (err) {
      alert("Excel 导出失败：" + (err && err.message ? err.message : err) + "\n（需可访问 cdn.jsdelivr.net 加载导出库）");
    }).then(function () {
      if (btn) { btn.textContent = old; btn.classList.remove("disabled"); }
    });
  }

  // 微博最新动态 → Excel
  function exportLatestPostsXlsx() {
    var d = LATEST_DATA || window.INITIAL_DATA;
    if (!d) { alert("暂无数据，无法导出"); return; }
    var posts = d.posts || [];
    if (!posts.length) { alert("暂无最新微博"); return; }
    var btn = document.getElementById("latestPostsXlsxBtn");
    var old = btn ? btn.textContent : "";
    if (btn) { btn.textContent = "生成中…"; btn.classList.add("disabled"); }
    ensureXLSX().then(function (XLSX) {
      var head = ["发布时间", "正文", "点赞", "转发", "评论", "链接"];
      var aoa = [head];
      posts.forEach(function (p) {
        var txt = (p.text_raw || p.text || "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
        aoa.push([p.created_at_str || p.created_at || "", txt,
                  p.attitudes_count || 0, p.reposts_count || 0, p.comments_count || 0,
                  p.url || ""]);
      });
      var wb = XLSX.utils.book_new();
      var sheet = XLSX.utils.aoa_to_sheet(aoa);
      sheet['!cols'] = [{wch:18},{wch:60},{wch:10},{wch:10},{wch:10},{wch:40}];
      XLSX.utils.book_append_sheet(wb, sheet, "微博最新动态");
      var ts = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, "微博最新动态_" + ts + ".xlsx");
    }).catch(function (err) {
      alert("Excel 导出失败：" + (err && err.message ? err.message : err) + "\n（需可访问 cdn.jsdelivr.net 加载导出库）");
    }).then(function () {
      if (btn) { btn.textContent = old; btn.classList.remove("disabled"); }
    });
  }

  // ---------------- 初始化 ----------------
  var root = document.getElementById("root");
  if (!root) return;

  var LATEST_DATA = null;
  function paint(d) {
    LATEST_DATA = d;
    root.innerHTML = renderDashboard(d);
    _updatePostsSortIndicators();
    root.querySelectorAll(".ed-range-row .pl-range button").forEach(function (b) {
      b.addEventListener("click", function () {
        currentRange = b.getAttribute("data-r");
        root.querySelectorAll(".ed-range-row .pl-range button").forEach(function (x) {
          x.classList.toggle("active", x.getAttribute("data-r") === currentRange);
        });
        regenTrendCharts();
      });
    });
  }

  paint(transform(window.INITIAL_DATA || { points_main: [], points_sub: [], milestones_main: { groups: [] }, topic_points: [], topic_latest: null, url: "https://weibo.com/u/5908064369", topic_url: "" }));

  // tooltip（事件委托，重渲染安全）
  var tipLayer = document.createElement("div");
  tipLayer.className = "dy-tip";
  tipLayer.style.display = "none";
  document.body.appendChild(tipLayer);

  function showTip(g, ev) {
    var ds = g.dataset || {};
    if (!ds.tt && !ds.dg) return false;
    var subHtml = "";
    if (ds.sub) subHtml = '<div class="sub">' + esc(ds.sub) + '</div>';
    var title = ds.tt ? '<div class="ttl">' + esc(ds.tt) + '</div>' : '';
    var meta = '';
    if (ds.dg) meta += '<span class="dl">点赞 <b>' + humanize(Number(ds.dg) || 0) + '</b></span>';
    if (ds.dt) meta += (meta ? '<span class="sep">·</span>' : '') + '<span class="dt">' + esc(ds.dt) + '</span>';
    var metaHtml = meta ? '<div class="meta">' + meta + '</div>' : '';
    var urlHint = ds.href ? '<div class="hint">→ 在微博打开</div>' : '';
    tipLayer.innerHTML = title + subHtml + metaHtml + urlHint;
    tipLayer.style.display = "block";
    var wrap = g.closest(".chart-wrap") || document.body;
    var r = g.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    var tw = tipLayer.offsetWidth, th = tipLayer.offsetHeight;
    var left = (r.left + r.width / 2 - wr.left);
    var top = (r.top - wr.top - th - 10);
    var leftMin = 6, leftMax = wr.width - tw - 6;
    if (left < leftMin) left = leftMin;
    if (left > leftMax) left = leftMax;
    if (top < 0) top = (r.bottom - wr.top + 10);
    tipLayer.style.left = left + "px";
    tipLayer.style.top = top + "px";
    return true;
  }
  function hideTip() { tipLayer.style.display = "none"; }

  document.addEventListener("mouseover", function (ev) {
    var g = ev.target.closest ? ev.target.closest("svg [data-i]") : null;
    if (g) showTip(g, ev); else hideTip();
  });
  document.addEventListener("mouseout", function (ev) {
    var g = ev.target.closest ? ev.target.closest("svg [data-i]") : null;
    if (g) hideTip();
  });
  document.addEventListener("mousemove", function (ev) {
    var g = ev.target.closest ? ev.target.closest("svg [data-i]") : null;
    if (g) showTip(g, ev);
  });

  // 点击事件委托（重渲染安全）
  document.addEventListener("click", function (e) {
    var sd = e.target.closest ? e.target.closest('[data-act="super-daily-xlsx"]') : null;
    if (sd) { e.preventDefault(); exportSuperDailyXlsx(); return; }
    var lp = e.target.closest ? e.target.closest('[data-act="latest-posts-xlsx"]') : null;
    if (lp) { e.preventDefault(); exportLatestPostsXlsx(); return; }
    var sp = e.target.closest ? e.target.closest('[data-act="posts-sort"]') : null;
    if (sp) {
      e.preventDefault();
      var key = sp.getAttribute("data-key");
      if (POST_SORT.key === key) {
        POST_SORT.dir = POST_SORT.dir === "asc" ? "desc" : "asc";
      } else {
        POST_SORT.key = key;
        POST_SORT.dir = "desc";
      }
      var body = document.getElementById("latestPostsBody");
      if (body) body.innerHTML = _renderPostsBody((FULL_DATA && FULL_DATA.posts) || []);
      _updatePostsSortIndicators();
      return;
    }
  });
})();
