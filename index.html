<!DOCTYPE html>
<html lang='zh-CN'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>张真源 · 抖音数据月刊</title>
<style>
:root{
--g:#16a34a;--gd:#157a3a;--gl:#22c55e;--gxl:#f1faf4;--gxx:#ffffff;
/* 张真源应援深绿：H1/H2/KPI 大数字等主要文字统一用 --ink（深绿） */
--ink:#14532d;--ink-deep:#0a3d24;--ink-mid:#1f5e3a;
--muted:#4a7060;--muted2:#7a9a8c;
--paper:#faf8f3;--rule:#1a1a1a;--rule2:#e6e3dc;--rule3:#c9c4b8;
/* 暖橘点缀（应援海报里的补丁色，仅作 motto / 编号等小标记用） */
--accent-warm:#c2410c;
--bd:rgba(20,124,58,.10);--bd2:rgba(20,124,58,.20);
--shadow:0 1px 2px rgba(16,58,43,.04),0 10px 30px rgba(16,58,43,.07);
--shadow-sm:0 1px 2px rgba(16,58,43,.05);
--shadow-lg:0 2px 6px rgba(16,58,43,.06),0 24px 50px rgba(16,58,43,.12);
--radius:20px;--radius-sm:13px;
--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSongti-SC-Regular","SimSun","宋体",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
html,body{font-family:var(--ff);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
line-height:1.55;background:var(--paper);background-attachment:fixed;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;}

/* 顶部导航 */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.7);
backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
border-bottom:1px solid var(--bd);box-shadow:0 1px 0 rgba(255,255,255,.6);}
.nav-in{max-width:1080px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;
justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px;color:var(--gd);font-size:16px;}
.brand .logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--gl),var(--gd));
color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
box-shadow:0 6px 14px rgba(22,163,74,.3);}
.nav-links{display:flex;gap:5px;align-items:center;}
.nav-links a{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gd);transition:.2s;}
.nav-links a:hover{background:rgba(22,163,74,.1);}
.nav-links a.active{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;
box-shadow:0 6px 16px rgba(22,163,74,.28);}
.nav-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.nav-status .dot-live{width:8px;height:8px;border-radius:50%;background:var(--gl);
box-shadow:0 0 0 4px rgba(34,197,94,.16);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.18);}50%{box-shadow:0 0 0 6px rgba(34,197,94,.06);}}

/* 容器与区块 */
.wrap{max-width:980px;margin:0 auto;padding:24px 22px 56px;}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:48px 0 18px;
padding-top:30px;border-top:1px solid var(--rule);}
.section-h h2{font-family:var(--serif);font-size:26px;color:var(--ink);font-weight:700;letter-spacing:-.2px;line-height:1.2;}
.section-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:5px;letter-spacing:.2px;}
.hr-title{font-size:15px;color:var(--gd);font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:9px;}
.hr-title::before{content:"";width:4px;height:16px;border-radius:3px;
background:linear-gradient(var(--gl),var(--gd));display:inline-block;}

/* 卡片 */
.card{background:var(--gxx);border:1px solid var(--bd);border-radius:var(--radius);
box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
font-family:var(--ff);font-weight:600;font-size:13px;padding:10px 18px;border-radius:999px;
border:1px solid var(--rule);cursor:pointer;transition:.2s;white-space:nowrap;background:transparent;color:var(--ink);}
.btn:hover{background:var(--ink);color:#fff;}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-primary:hover{background:var(--g);border-color:var(--g);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule);}
.btn:disabled{opacity:.55;cursor:not-allowed;}

/* 表单 */
.field{width:100%;padding:14px 16px;border:1px solid var(--bd2);border-radius:var(--radius-sm);
font-size:14px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:.18s;}
.field:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(22,163,74,.12);}
.field::placeholder{color:#a8bbb0;}

/* 标签 / 徽标 */
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;
font-weight:700;line-height:1.5;letter-spacing:.3px;}
.badge-soft{background:rgba(22,163,74,.1);color:var(--gd);}
.badge-line{border:1px solid var(--bd2);color:var(--gd);}
.badge-g{background:var(--g);color:#fff;}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:13px 14px;color:var(--muted);font-weight:600;font-size:11.5px;
letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--bd);}
.tbl td{padding:13px 14px;border-bottom:1px solid rgba(20,124,58,.07);vertical-align:middle;}
.tbl tbody tr{transition:.15s;}
.tbl tbody tr:hover{background:rgba(22,163,74,.05);}
.tbl a{color:var(--ink);font-weight:600;}
.tbl a:hover{color:var(--gd);text-decoration:underline;}
.rk{color:var(--gd);font-weight:800;width:46px;}

/* 提示框 / 空态 */
.box{background:var(--gxl);border:1px solid var(--bd);border-radius:var(--radius-sm);padding:16px 18px;
font-size:14px;line-height:1.65;}
.box.err{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
.empty{text-align:center;color:var(--muted);padding:46px 16px;font-size:13.5px;}
.muted{color:var(--muted);font-size:12px;}
.foot{text-align:center;color:var(--muted2);font-size:12px;margin-top:40px;letter-spacing:.4px;}

/* 动效 */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeArea{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .6s ease both;}
.fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;}
.dy-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease forwards;}
.dy-area{opacity:0;animation:fadeArea 1s ease .25s forwards;}

/* 响应式 */
@media (max-width:760px){
.wrap{padding:16px 14px 38px;}
.nav-in{padding:11px 14px;gap:10px;}
.nav-status{display:none;}
.nav-links a{padding:7px 12px;font-size:12.5px;}
.section-h{flex-direction:column;align-items:flex-start;gap:8px;margin:30px 0 14px;}
}
@media (max-width:480px){
.nav-links a.extra{display:none;}
}
.ed-masthead{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:18px;
padding:34px 0 18px;border-bottom:1.2px solid var(--rule);}
.ed-masthead .lt{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink-deep);
letter-spacing:-.2px;}
.ed-masthead .rt{font-size:10.5px;letter-spacing:2.2px;color:#666;text-align:right;
text-transform:uppercase;}
.ed-masthead .rt b{color:var(--accent-warm);font-weight:700;}
/* 顶部口号 "ALL FOR ZZY"：衬线暖橘小字，张真源应援口号的杂志式呈现 */
.ed-masthead .motto{position:absolute;left:0;top:10px;font-family:var(--serif);font-size:10.5px;
letter-spacing:3.6px;color:var(--accent-warm);font-weight:600;text-transform:uppercase;
display:flex;align-items:center;gap:10px;margin:0;line-height:1;}
.ed-masthead .motto::before{content:"";display:inline-block;width:22px;height:1px;background:var(--accent-warm);}
.ed-masthead .motto::after{content:"";display:inline-block;width:42px;height:1px;background:var(--accent-warm);opacity:.35;}
/* masthead 右上角：白色蝴蝶剪影 + 颗粒光点（低饱和深绿，不抢主文字） */
.ed-masthead .deco{position:absolute;right:0;top:0;width:148px;height:42px;pointer-events:none;}
.ed-masthead .deco .bf{position:absolute;right:0;top:0;width:78px;color:var(--ink-mid);opacity:.20;}
.ed-masthead .deco .sd{position:absolute;right:74px;top:10px;width:64px;color:var(--ink-mid);opacity:.55;}
.ed-masthead .deco svg{display:block;fill:currentColor;}
.ed-vol{font-size:11px;letter-spacing:2.6px;color:#888;margin-top:14px;text-transform:uppercase;}
.ed-vol b{color:var(--ink);font-weight:700;}

.ed-stat{position:relative;margin:48px 0 12px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;
padding-bottom:18px;border-bottom:1px solid var(--rule2);}
/* ed-stat 右上角：极小蝴蝶剪影，仅装饰 */
.ed-stat .deco{position:absolute;right:0;top:0;width:36px;height:18px;
color:var(--ink-mid);opacity:.16;pointer-events:none;}
.ed-stat .deco svg{display:block;width:100%;height:auto;fill:currentColor;}
.ed-stat .label{font-size:11px;letter-spacing:2.6px;color:var(--g);font-weight:700;
margin-bottom:14px;text-transform:uppercase;}
.ed-stat .num{font-family:var(--serif);font-size:clamp(56px,8vw,108px);font-weight:700;
color:var(--ink);letter-spacing:-2px;line-height:.95;font-feature-settings:"tnum";}
.ed-stat .num .raw{font-family:var(--ff);font-size:13px;color:#888;font-weight:500;
margin-left:12px;letter-spacing:0;vertical-align:middle;}
.ed-stat .sub{font-size:13px;color:#666;margin-top:14px;letter-spacing:.3px;}
.ed-stat .meta{text-align:right;font-size:11px;letter-spacing:1.5px;color:#666;
text-transform:uppercase;line-height:1.9;}
.ed-stat .meta b{color:var(--g);font-weight:700;font-family:var(--serif);
font-size:14px;letter-spacing:-.2px;text-transform:none;}

.ed-rule{height:1px;background:var(--rule);margin:0 0 36px;opacity:.92;}

.ed-charts{display:grid;grid-template-columns:1fr 1fr;gap:42px;}
.ed-chart .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);
margin-bottom:6px;letter-spacing:-.1px;}
.ed-chart .sub{font-size:10.5px;letter-spacing:1.8px;color:#888;margin-bottom:18px;
text-transform:uppercase;}
.ed-chart .frame{padding:10px 0 12px;border-bottom:.5px solid var(--rule);}

.ed-pub{margin-top:36px;padding:18px 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);}
.ed-pub .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.1px;}
.ed-pub .sub{font-size:10.5px;letter-spacing:1.8px;color:#888;margin-bottom:14px;text-transform:uppercase;}
.ed-pub .frame{padding:6px 0 12px;}

.ed-list{margin:0;padding:0;}
.ed-list-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule);}
.ed-list-head .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.1px;}
.ed-list-head .meta{font-size:10.5px;letter-spacing:1.8px;color:#888;text-transform:uppercase;}
.ed-list .row{display:grid;grid-template-columns:46px 1fr 120px 84px;gap:18px;
align-items:baseline;padding:13px 0;border-bottom:.5px solid var(--rule2);
transition:background .18s;}
.ed-list .row:hover{background:rgba(22,163,94,.04);}
.ed-list .no{font-family:var(--serif);font-size:13px;font-style:italic;color:#888;
font-weight:500;letter-spacing:.5px;}
.ed-list .title{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);
letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
display:block;}
.ed-list .title:hover{color:var(--g);}
.ed-list .time{font-size:11.5px;color:#666;letter-spacing:.3px;font-feature-settings:"tnum";}
.ed-list .nums{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--g);
text-align:right;font-feature-settings:"tnum";}
.ed-list-foot{padding:14px 0 0;font-size:10.5px;letter-spacing:1.8px;color:#888;text-align:center;}

/* 无后端时 nav/backend 按钮的禁用样式：仅变灰 + tooltip，不替换 DOM */
.nav-links a.disabled,.ed-xlsx-btn.disabled{
  opacity:.32;cursor:not-allowed;color:var(--muted);pointer-events:none;
}

/* 作品缩略图矩阵（替代长文字列表，数量已并入块标题） */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px;margin-top:14px;}
.wt{position:relative;display:block;aspect-ratio:3/4;border-radius:13px;overflow:hidden;
background:var(--gxl);border:1px solid var(--bd);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;}
.wt:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.wt.miss{background:linear-gradient(135deg,var(--gl),var(--gd));}
.wt img{width:100%;height:100%;object-fit:cover;display:block;}
.wt .scrim{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;
background:linear-gradient(transparent,rgba(10,61,36,.82));pointer-events:none;}
.wt .lk{display:flex;align-items:center;gap:3px;color:#fff;font-family:var(--serif);
font-weight:700;font-size:12.5px;font-feature-settings:"tnum";line-height:1;}
.wt .lk svg{width:10px;height:10px;fill:#fff;opacity:.92;flex:none;}
.wt .ti{margin-top:3px;font-size:10px;line-height:1.3;color:rgba(255,255,255,.85);
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wt .mt-badge{position:absolute;left:7px;top:7px;z-index:2;background:var(--ink-deep);
color:#fff;font-family:var(--serif);font-size:9px;font-weight:700;letter-spacing:.3px;
padding:3px 7px;border-radius:20px;box-shadow:0 2px 6px rgba(10,61,36,.35);}
.wt .mt-time{margin-top:3px;font-size:8.5px;line-height:1;color:rgba(255,255,255,.82);
letter-spacing:.2px;font-feature-settings:"tnum";}

/* 破百万节点已合并到作品缩略图标签（见 .wt .mt-badge） */

.ed-topics{margin-top:8px;}
.ed-topics-row{font-size:13.5px;color:var(--ink);line-height:2;}
.ed-topics-row .tg{display:inline-block;margin:0 18px 8px 0;font-family:var(--serif);font-weight:600;}
.ed-topics-row .tg:hover{color:var(--g);}
.ed-topics-row .v{color:#999;font-family:var(--ff);font-size:12px;font-weight:500;
margin-left:4px;letter-spacing:.3px;}

.ed-export{margin-top:30px;text-align:center;}
.ed-xlsx-btn{display:inline-block;padding:11px 22px;border:1.2px solid var(--bd2);
border-radius:24px;color:var(--ink);font-family:var(--serif);font-size:13px;font-weight:600;
letter-spacing:.5px;text-decoration:none;transition:background .18s,border-color .18s;}
.ed-xlsx-btn:hover{background:var(--gxl);border-color:var(--gd);}

.foot{margin-top:42px;padding-top:24px;border-top:.5px solid var(--rule2);
text-align:center;font-size:10.5px;letter-spacing:2px;color:#888;text-transform:uppercase;}
.foot b{color:var(--ink);font-weight:700;}
/* footer 拼音标 + 应援拉丁 motto：蝴蝶意象 + 应援口号 */
.foot .motto-row{font-family:var(--serif);font-size:13px;letter-spacing:5px;
color:var(--ink-deep);font-weight:700;text-transform:uppercase;margin:0 0 6px;
display:flex;align-items:center;justify-content:center;gap:12px;}
.foot .motto-row::before,.foot .motto-row::after{content:"";display:inline-block;width:32px;height:1px;background:var(--ink-mid);opacity:.55;}
.foot .latin{font-family:var(--serif);font-style:italic;color:var(--muted);
letter-spacing:.5px;text-transform:none;font-size:11.5px;margin-top:10px;font-weight:400;}

.chart-wrap{position:relative;background:transparent;border:0;border-radius:0;padding:0;}
.chart-wrap svg circle.pt{transition:r .18s ease;cursor:pointer;}
.chart-wrap svg g[data-i]:hover circle.pt{r:6;}
.chart-wrap svg g[data-i]{cursor:pointer;}

.dy-tip{position:absolute;pointer-events:none;z-index:9999;background:rgba(17,17,17,.96);color:#fff;
padding:9px 12px;border-radius:6px;font-size:11.5px;line-height:1.6;max-width:260px;white-space:pre-line;
box-shadow:0 8px 22px rgba(0,0,0,.22);transform:translate(-50%,-100%);font-family:var(--ff);}
.dy-tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
border:5px solid transparent;border-top-color:rgba(17,17,17,.96);}

@media (max-width:760px){
.wrap{padding:18px 16px 42px;}
.ed-stat{grid-template-columns:1fr;gap:14px;}
.ed-stat .meta{text-align:left;}
.ed-stat .num{font-size:54px;}
.ed-charts{grid-template-columns:1fr;gap:28px;}
.ed-list .row{grid-template-columns:38px 1fr 64px;gap:10px;}
.ed-list .time{display:none;}
.wall{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;}
.ms-scale span{font-size:7px;}
.ms-scale,.ms-bar{margin-left:14px;margin-right:14px;}
.ed-pub{margin-top:28px;}
.ed-masthead{flex-direction:column;gap:8px;align-items:flex-start;}
.ed-masthead .rt{text-align:left;}
.ed-list-head{flex-direction:column;align-items:flex-start;gap:4px;}
}
</style></head>

    var bottom = pad_t + plot_h;
    var xs = (n === 1) ? [pad_l + plot_w / 2]
      : values.map(function (_, i) { return pad_l + i * (plot_w / (n - 1)); });

    var vmin = Math.min.apply(null, values), vmax = Math.max.apply(null, values);
    var yf, yticks, lo, hi;
    if (log) {
      lo = Math.floor(Math.log10(Math.max(vmin, 1)));
      hi = Math.ceil(Math.log10(Math.max(vmax, 1)));
      if (hi === lo) hi = lo + 1;
      yf = function (v) { var lv = Math.log10(Math.max(v, 1)); return pad_t + plot_h - (lv - lo) / (hi - lo) * plot_h; };
      yticks = []; for (var e = lo; e <= hi; e++) yticks.push(Math.pow(10, e));
    } else {
      if (relative_start) {
        var span = Math.max(Math.abs(vmin), Math.abs(vmax)) || 1;
        hi = span * 1.15; lo = -span * 1.15;
        yf = function (v) { return pad_t + plot_h - ((v - lo) / (hi - lo)) * plot_h; };
        yticks = [-span, -span / 2, 0, span / 2, span];
      } else {
        hi = (vmax * 1.12) || 1; lo = 0;
        yf = function (v) { return pad_t + plot_h - (v / hi) * plot_h; };
        yticks = [0, hi * 0.25, hi * 0.5, hi * 0.75, hi];
      }
    }

    var pts = values.map(function (v, i) { return [xs[i], yf(v)]; });
    var line = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + " " + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = line + " L " + pts[n - 1][0].toFixed(1) + " " + bottom.toFixed(1) +
      " L " + pts[0][0].toFixed(1) + " " + bottom.toFixed(1) + " Z";

    var grid = [];
    for (var g = 0; g < yticks.length; g++) {
      var tv = yticks[g], y = yf(tv);
      grid.push('<line x1="' + pad_l + '" x2="' + (pad_l + plot_w) + '" y1="' + y.toFixed(1) +
        '" y2="' + y.toFixed(1) + '" stroke="' + BORDER + '" stroke-dasharray="2,3"/>');
      var label;
      if (relative_start) label = (tv === 0) ? "0" : (tv > 0 ? "+" + fmtNum(tv) : "−" + fmtNum(-tv));
      else label = fmtNum(tv);
      grid.push('<text x="' + (pad_l - 7).toFixed(1) + '" y="' + y.toFixed(1) +
        '" text-anchor="end" font-size="10" fill="' + MUTED + '" dominant-baseline="middle">' + label + '</text>');
    }
    var xt = [];
    var step = Math.max(1, Math.floor(n / 7));
    for (var xi = 0; xi < n; xi += step) {
      xt.push('<text x="' + xs[xi].toFixed(1) + '" y="' + (bottom + 18).toFixed(1) +
        '" text-anchor="middle" font-size="10" fill="' + MUTED + '">' + esc(xlabels[xi]) + '</text>');
    }
    if (n > 1 && (n - 1) % step !== 0) {
      xt.push('<text x="' + xs[n - 1].toFixed(1) + '" y="' + (bottom + 18).toFixed(1) +
        '" text-anchor="middle" font-size="10" fill="' + MUTED + '">' + esc(xlabels[n - 1]) + '</text>');
    }
    var zero_line = "";
    if (relative_start) {
      var y0 = yf(0);
      zero_line = '<line x1="' + pad_l + '" x2="' + (pad_l + plot_w) + '" y1="' + y0.toFixed(1) +
        '" y2="' + y0.toFixed(1) + '" stroke="' + color + '" stroke-width="1" stroke-opacity="0.35"/>';
    }
    var dots = [];
    var titles = (point_titles && point_titles.length === n) ? point_titles : null;
    var hrefs = (point_hrefs && point_hrefs.length === n) ? point_hrefs : null;
    for (var di = 0; di < n; di++) {
      var x = pts[di][0], y = pts[di][1];
      var is_last = (di === n - 1);
      var hit = '<rect x="' + (x - 12).toFixed(1) + '" y="' + (y - 12).toFixed(1) + '" width="24" height="24" fill="transparent" pointer-events="all"/>';
      var inner;
      if (is_last) {
        inner = hit +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="9" fill="' + color + '" fill-opacity="0.12" pointer-events="none"/>' +
          '<circle class="pt" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4.5" fill="' + color + '" stroke="#fff" stroke-width="2" pointer-events="none"/>';
      } else {
        inner = hit +
          '<circle class="pt" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="#fff" stroke="' + color + '" stroke-width="2" pointer-events="none"/>';
      }
      if (hrefs && hrefs[di]) {
        var safe = String(hrefs[di]).replace(/"/g, "&quot;");
        dots.push('<g data-i="' + di + '" data-href="' + safe + '"><a href="' + safe + '" target="_blank" rel="noopener">' + inner + '</a></g>');
      } else {
        dots.push('<g data-i="' + di + '">' + inner + '</g>');
      }
    }
    var id_attr = chart_id ? ' id="' + chart_id + '"' : "";
    return '<svg' + id_attr + ' viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:' + h + 'px">' +
      grid.join("") + xt.join("") + zero_line +
      '<path class="dy-area" d="' + area + '" fill="' + color + '" fill-opacity="0.10"/>' +
      '<path class="dy-line" d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/>' +
      dots.join("") + '</svg>';
  }

  // ---------------- 客户端导出 Excel（无需后端） ----------------
  function ensureXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function (resolve, reject) {
      var urls = [
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
        "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"
      ];
      var i = 0;
      function tryLoad() {
        if (i >= urls.length) { reject(new Error("无法加载 Excel 库")); return; }
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = function () { window.XLSX ? resolve(window.XLSX) : tryLoad(); };
        s.onerror = tryLoad;
        document.head.appendChild(s);
      }
      tryLoad();
    });
  }
  function fmtDateTime(unix) {
    if (!unix) return "";
    var t = parseInt(unix, 10); if (isNaN(t)) return "";
    var d = new Date(t * 1000);
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function exportXlsx() {
    var d = LATEST_DATA || window.INITIAL_DATA;
    if (!d) { alert("暂无数据，无法导出"); return; }
    var btn = document.getElementById("edXlsxBtn");
    var old = btn ? btn.textContent : "";
    if (btn) { btn.textContent = "生成中…"; btn.classList.add("disabled"); }
    ensureXLSX().then(function (XLSX) {
      var head = d.head || {};
      var nick = head.nickname || "张真源";
      var followers = d.followers || [], likedV = d.liked || [], fd = d.followers_delta || [], labels = d.labels || [];
      var fans = followers.length ? followers[followers.length - 1] : 0;
      var liked = likedV.length ? likedV[likedV.length - 1] : 0;
      var lastUpdate = labels.length ? labels[labels.length - 1] : "—";
      var now = new Date();
      var pad = function (x) { return (x < 10 ? "0" : "") + x; };
      var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "_" + pad(now.getHours()) + pad(now.getMinutes());

      var overview = [
        ["张真源 · 抖音数据月刊 — 数据导出"],
        ["导出时间", fmtDateTime(Math.floor(Date.now() / 1000))],
        ["账号", nick],
        ["抖音号", PUBLIC_ID],
        ["粉丝数", fans],
        ["总获赞", liked],
        ["作品数", d.post_count || (d.post_cards ? d.post_cards.length : 0)],
        ["最近更新", lastUpdate]
      ];
      var trend = [["时间", "粉丝数", "粉丝增量", "总获赞"]];
      for (var i = 0; i < labels.length; i++) {
        var inc = (i > 0 && followers[i - 1] != null) ? (followers[i] - followers[i - 1]) : (fd[i] != null ? fd[i] : 0);
        trend.push([labels[i], followers[i] != null ? followers[i] : "", inc, likedV[i] != null ? likedV[i] : ""]);
      }
      var works = [["序号", "作品ID", "标题", "发布时间", "点赞", "评论", "收藏", "分享", "播放", "分享链接", "封面链接"]];
      var pc = d.post_cards || [];
      for (var k = 0; k < pc.length; k++) {
        var c = pc[k];
        works.push([k + 1, c.aweme_id || "", (c.desc || "").slice(0, 300), fmtDateTime(c.create_time),
          c.digg || 0, c.comment || 0, c.collect || 0, c.share_c || 0, c.play || 0,
          c.share || "", c.cover || ""]);
      }
      var topics = [["排名", "名称", "播放", "参与", "视频"]];
      var tp = (d.boards && d.boards.topic) || [];
      for (var t = 0; t < tp.length; t++) {
        var it = tp[t], ex = it.extra || {};
        topics.push([it.rank, it.name, ex.view_count || 0, ex.user_count || 0, ex.video_count || 0]);
      }

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(overview), "概览");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(trend), "粉丝获赞趋势");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(works), "作品明细");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(topics), "话题");
      var safe = (nick || "张真源").replace(/[^\w一-龥\-_]/g, "_").slice(0, 30) || "douyin";
      XLSX.writeFile(wb, safe + "_数据_" + ts + ".xlsx");
    }).catch(function (err) {
      alert("Excel 导出失败：" + (err && err.message ? err.message : err) + "\n（需可访问 cdn.jsdelivr.net 加载导出库）");
    }).then(function () {
      if (btn) { btn.textContent = old; btn.classList.remove("disabled"); }
    });
  }

  // ---------------- 初始化 ----------------
  var root = document.getElementById("root");
  if (!root) return;

  var LATEST_DATA = null;
  function paint(d) { LATEST_DATA = d; root.innerHTML = renderDashboard(d); applyBackendState(); }

  // 首屏：用构建时内联的数据，避免白屏
  paint(window.INITIAL_DATA || { labels: [], post_cards: [], mode: "awaiting-config", post_count: 0, head: {} });

  // tooltip（事件委托，重渲染安全）
  var tipLayer = document.createElement("div");
  tipLayer.className = "dy-tip";
  tipLayer.style.display = "none";
  document.body.appendChild(tipLayer);
  document.addEventListener("mouseover", function (ev) {
    var g = ev.target.closest ? ev.target.closest("svg [data-i]") : null;
    if (!g) return;
    var titleTag = g.querySelector("title");
    var title = titleTag ? titleTag.textContent : "";
    if (!title) return;
    tipLayer.textContent = title;
    tipLayer.style.display = "block";
    var wrap = g.closest(".chart-wrap");
    var r = g.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    tipLayer.style.left = (r.left + r.width / 2 - wr.left) + "px";
    tipLayer.style.top = (r.top - wr.top - 8) + "px";
  });
  document.addEventListener("mouseout", function (ev) {
    if (ev.target.closest && ev.target.closest("svg [data-i]")) tipLayer.style.display = "none";
  });

  // 后端探测：本地服务（有后端）真实跳转；无后端（GitHub/CloudStudio）置灰 backend 链接
  var BACKEND_OK = null;
  function probe() {
    return fetch("/api/users").then(function (r) { return r.json(); })
      .then(function (j) { return !!(j && j.ok); })
      .catch(function () { return false; });
  }
  function showDisabled(a, msg) {
    if (!a) return;
    a.classList.add("disabled");
    a.setAttribute("title", msg);
    a.setAttribute("aria-disabled", "true");
  }
  // 每次重渲染后根据探测结果置灰 backend 链接（无需后端的功能保持可用）
  function applyBackendState() {
    if (BACKEND_OK === false) {
      var bs = document.querySelectorAll('a[data-nav="backend"]');
      for (var i = 0; i < bs.length; i++)
        showDisabled(bs[i], "需在本机运行 python src/server.py 后访问 localhost 才能使用（静态托管站无后端）");
    }
  }
  // 点击事件委托（重渲染安全）
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[data-nav]") : null;
    if (!a) return;
    var nav = a.getAttribute("data-nav");
    if (nav === "reload") { e.preventDefault(); location.reload(); return; }
    if (nav === "xlsx") { e.preventDefault(); exportXlsx(); return; }
    if (nav === "backend") {
      e.preventDefault();
      if (BACKEND_OK) { window.location.href = a.getAttribute("href"); }
      else if (BACKEND_OK === false) { /* 已置灰，无需处理 */ }
      else { probe().then(function (ok) { BACKEND_OK = ok; applyBackendState(); if (ok) window.location.href = a.getAttribute("href"); }); }
    }
  });
  probe().then(function (ok) { BACKEND_OK = ok; applyBackendState(); });

  // 实时拉取最新 data.json（同源 → jsDelivr → raw），成功则覆盖重渲染
  var DATA_SOURCES = [
    "data.json",
    "https://cdn.jsdelivr.net/gh/kylinzzy/zzy-douyin-monitor@main/data.json",
    "https://raw.githubusercontent.com/kylinzzy/zzy-douyin-monitor/main/data.json"
  ];
  function fetchLatest(i) {
    i = i || 0;
    if (i >= DATA_SOURCES.length) return;
    fetch(DATA_SOURCES[i], { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (j) {
      paint(j);
    }).catch(function () {
      fetchLatest(i + 1);
    });
  }
  fetchLatest();
})();
</script>
</body></html>
