<!DOCTYPE html>
<html lang='zh-CN'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>张真源 · 抖音数据月刊</title>
<style>
:root{
--g:#16a34a;--gd:#157a3a;--gl:#22c55e;--gxl:#f1faf4;--gxx:#ffffff;
/* 张真源应援深绿：H1/H2/KPI 大数字等主要文字统一用 --ink（深绿） */
--ink:#14532d;--ink-deep:#0a3d24;--ink-mid:#1f5e3a;
--muted:#4a7060;--muted2:#7a9a8c;
--paper:#faf8f3;--rule:#1a1a1a;--rule2:#e6e3dc;--rule3:#c9c4b8;
/* 暖橘点缀（应援海报里的补丁色，仅作 motto / 编号等小标记用） */
--accent-warm:#c2410c;
--bd:rgba(20,124,58,.10);--bd2:rgba(20,124,58,.20);
--shadow:0 1px 2px rgba(16,58,43,.04),0 10px 30px rgba(16,58,43,.07);
--shadow-sm:0 1px 2px rgba(16,58,43,.05);
--shadow-lg:0 2px 6px rgba(16,58,43,.06),0 24px 50px rgba(16,58,43,.12);
--radius:20px;--radius-sm:13px;
--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSongti-SC-Regular","SimSun","宋体",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
html,body{font-family:var(--ff);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
line-height:1.55;background:var(--paper);background-attachment:fixed;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;}

/* 顶部导航 */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.7);
backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
border-bottom:1px solid var(--bd);box-shadow:0 1px 0 rgba(255,255,255,.6);}
.nav-in{max-width:1080px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;
justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px;color:var(--gd);font-size:16px;}
.brand .logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--gl),var(--gd));
color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
box-shadow:0 6px 14px rgba(22,163,74,.3);}
.nav-links{display:flex;gap:5px;align-items:center;}
.nav-links a{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gd);transition:.2s;}
.nav-links a:hover{background:rgba(22,163,74,.1);}
.nav-links a.active{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;
box-shadow:0 6px 16px rgba(22,163,74,.28);}
.nav-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.nav-status .dot-live{width:8px;height:8px;border-radius:50%;background:var(--gl);
box-shadow:0 0 0 4px rgba(34,197,94,.16);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.18);}50%{box-shadow:0 0 0 6px rgba(34,197,94,.06);}}

/* 容器与区块 */
.wrap{max-width:980px;margin:0 auto;padding:24px 22px 56px;}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:48px 0 18px;
padding-top:30px;border-top:1px solid var(--rule);}
.section-h h2{font-family:var(--serif);font-size:26px;color:var(--ink);font-weight:700;letter-spacing:-.2px;line-height:1.2;}
.section-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:5px;letter-spacing:.2px;}
.hr-title{font-size:15px;color:var(--gd);font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:9px;}
.hr-title::before{content:"";width:4px;height:16px;border-radius:3px;
background:linear-gradient(var(--gl),var(--gd));display:inline-block;}

/* 卡片 */
.card{background:var(--gxx);border:1px solid var(--bd);border-radius:var(--radius);
box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
font-family:var(--ff);font-weight:600;font-size:13px;padding:10px 18px;border-radius:999px;
border:1px solid var(--rule);cursor:pointer;transition:.2s;white-space:nowrap;background:transparent;color:var(--ink);}
.btn:hover{background:var(--ink);color:#fff;}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-primary:hover{background:var(--g);border-color:var(--g);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule);}
.btn:disabled{opacity:.55;cursor:not-allowed;}

/* 表单 */
.field{width:100%;padding:14px 16px;border:1px solid var(--bd2);border-radius:var(--radius-sm);
font-size:14px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:.18s;}
.field:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(22,163,74,.12);}
.field::placeholder{color:#a8bbb0;}

/* 标签 / 徽标 */
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;
font-weight:700;line-height:1.5;letter-spacing:.3px;}
.badge-soft{background:rgba(22,163,74,.1);color:var(--gd);}
.badge-line{border:1px solid var(--bd2);color:var(--gd);}
.badge-g{background:var(--g);color:#fff;}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:13px 14px;color:var(--muted);font-weight:600;font-size:11.5px;
letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--bd);}
.tbl td{padding:13px 14px;border-bottom:1px solid rgba(20,124,58,.07);vertical-align:middle;}
.tbl tbody tr{transition:.15s;}
.tbl tbody tr:hover{background:rgba(22,163,74,.05);}
.tbl a{color:var(--ink);font-weight:600;}
.tbl a:hover{color:var(--gd);text-decoration:underline;}
.rk{color:var(--gd);font-weight:800;width:46px;}

/* 提示框 / 空态 */
.box{background:var(--gxl);border:1px solid var(--bd);border-radius:var(--radius-sm);padding:16px 18px;
font-size:14px;line-height:1.65;}
.box.err{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
.empty{text-align:center;color:var(--muted);padding:46px 16px;font-size:13.5px;}
.muted{color:var(--muted);font-size:12px;}
.foot{text-align:center;color:var(--muted2);font-size:12px;margin-top:40px;letter-spacing:.4px;}

/* 动效 */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeArea{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .6s ease both;}
.fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;}
.dy-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease forwards;}
.dy-area{opacity:0;animation:fadeArea 1s ease .25s forwards;}

/* 响应式 */
@media (max-width:760px){
.wrap{padding:16px 14px 38px;}
.nav-in{padding:11px 14px;gap:10px;}
.nav-status{display:none;}
.nav-links a{padding:7px 12px;font-size:12.5px;}
.section-h{flex-direction:column;align-items:flex-start;gap:8px;margin:30px 0 14px;}
}
@media (max-width:480px){
.nav-links a.extra{display:none;}
}

/* ---- 时间筛选（pl-range / ov-range） ---- */
.pl-range,.ov-range{display:flex;gap:6px;align-items:center;}
.pl-range button,.ov-range button{border:1px solid var(--bd2);background:#fff;color:var(--gd);
font-weight:600;font-size:12px;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:var(--ff);transition:.18s;}
.pl-range button:hover,.ov-range button:hover{background:rgba(22,163,74,.08);}
.pl-range button.active,.ov-range button.active{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border-color:var(--g);}
.ed-range-row{display:flex;align-items:center;gap:14px;margin:18px 0 6px;}
.ed-range-row .lab{font-size:11px;letter-spacing:1.6px;color:var(--gd);font-weight:700;text-transform:uppercase;}

/* ---- 作品表格（抖音） ---- */
.wt-frame{max-height:520px;overflow:auto;border:1px solid var(--bd);border-radius:var(--radius);background:#fff;}
.wt-table{width:100%;border-collapse:collapse;font-size:12.5px;font-feature-settings:"tnum";}
.wt-table thead th{position:sticky;top:0;background:var(--gxl);color:var(--gd);
font-weight:700;padding:10px 14px;border-bottom:1px solid var(--bd2);font-size:11.5px;white-space:nowrap;z-index:1;}
.wt-table thead th.sticky-l{left:0;z-index:2;}
.wt-table tbody td{padding:9px 14px;border-bottom:1px solid var(--bd);color:var(--ink);white-space:nowrap;}
.wt-table tbody td.sticky-l{position:sticky;left:0;background:#fff;box-shadow:1px 0 0 var(--bd);z-index:0;}
.wt-table tbody tr:hover td{background:rgba(22,163,74,.04);}
.wt-table tbody tr:hover td.sticky-l{background:#f0fdf4;}
.wt-title{color:var(--ink);font-weight:600;max-width:220px;display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
.wt-title:hover{color:var(--gd);text-decoration:underline;}

/* ---- 单集百万节点 ---- */
.ms-frame{max-height:520px;overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:6px 22px;}
.ms-empty{padding:36px;text-align:center;color:var(--muted);font-size:13px;}
.ms-group{padding:16px 0;border-bottom:1px dashed var(--bd);}
.ms-group:last-child{border-bottom:none;}
.ms-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);margin-bottom:9px;}
.ms-title a:hover{color:var(--gd);text-decoration:underline;}
.ms-items{display:flex;flex-direction:column;gap:7px;padding-left:6px;}
.ms-row{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;font-size:13px;color:var(--ink);}
.ms-dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.18);}
.ms-val{font-weight:600;font-feature-settings:"tnum";}
.ms-time{color:var(--muted);font-feature-settings:"tnum";font-size:12.5px;}
.ms-row.new .ms-dot{background:var(--g);box-shadow:0 0 0 4px rgba(22,163,74,.28);animation:pulse 2s ease-in-out infinite;}
.ms-new{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;
background:rgba(22,163,74,.12);color:var(--gd);font-size:11px;font-weight:700;vertical-align:middle;}

/* ---- 作品表格（增强：可排序表头 + 紧凑下载按钮） ---- */
.wt-table thead th.sortable{cursor:pointer;transition:background .15s,color .15s;
position:sticky;top:0;}
.wt-table thead th.sortable:hover{background:var(--gl);color:var(--ink);}
.wt-table thead th .sort-ind{display:inline-block;width:11px;margin-left:4px;
color:var(--muted);font-size:9px;font-weight:700;vertical-align:1px;}
.wt-table thead th.sort-asc,.wt-table thead th.sort-desc{background:var(--gl);color:var(--ink);}
.wt-table thead th.sort-asc .sort-ind,.wt-table thead th.sort-desc .sort-ind{color:var(--accent-warm);}

/* 紧凑下载按钮（嵌入表头） */
.xlsx-mini{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;
border:1px solid var(--bd2);border-radius:18px;background:var(--gxl);
color:var(--ink);font-family:var(--serif);font-size:11.5px;font-weight:600;
letter-spacing:.5px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;
white-space:nowrap;}
.xlsx-mini:hover{background:var(--gl);border-color:var(--gd);color:var(--gd);}
.xlsx-mini svg{width:12px;height:12px;fill:currentColor;flex:none;}
.xlsx-mini.disabled{opacity:.4;pointer-events:none;}

/* ---- 单集百万节点（标签云 4 列 · 紧凑版） ---- */
/* 覆盖老 .ms-group 的 padding:16px 0（那个让组之间空 50px+ 的元凶） */
.ms-group{padding:0;margin-bottom:5px;border-bottom:none;}
.ms-group:last-child{margin-bottom:0;}
.ms-title{font-family:var(--serif);font-size:11.5px;font-weight:600;
color:var(--ink);margin:0 0 4px;padding-bottom:3px;border-bottom:.5px dashed var(--rule);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-title a:hover{color:var(--gd);text-decoration:underline;}
.ms-group a{color:var(--ink);}
.ms-group a:hover{color:var(--gd);}

.ms-tags{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 6px;padding:2px 0;}
.ms-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;
background:var(--gxl);border:1px solid var(--bd);border-radius:9px;
font-size:10.5px;color:var(--ink);font-feature-settings:"tnum";
font-family:var(--ff);transition:background .15s,border-color .15s,color .15s;
white-space:nowrap;min-width:0;line-height:1.6;}
.ms-tag:hover{background:var(--g);color:#fff;border-color:var(--g);}
.ms-tag .ms-num{font-weight:700;color:var(--gd);font-size:11px;}
.ms-tag .ms-date{color:#888;font-size:9.5px;}
.ms-tag:hover .ms-num,.ms-tag:hover .ms-date{color:#fff;}
.ms-tag.new{background:rgba(255,107,53,.06);border-color:var(--accent-warm);}
.ms-tag.new .ms-new{display:inline-block;font-size:8px;font-weight:700;color:var(--accent-warm);
background:rgba(255,107,53,.14);padding:0 4px;border-radius:5px;margin-left:2px;line-height:1.5;}

/* 覆盖 .ms-frame 原 padding:6px 22px → 紧凑 */
.ms-frame{padding:6px 14px;}

@media (max-width:760px){
  .ms-tags{grid-template-columns:repeat(2,minmax(0,1fr));}
}
.ed-masthead{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:18px;
padding:34px 0 18px;border-bottom:1.2px solid var(--rule);}
.ed-masthead .lt{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink-deep);
letter-spacing:-.2px;}
.ed-masthead .rt{font-size:10.5px;letter-spacing:2.2px;color:#666;text-align:right;
text-transform:uppercase;}
.ed-masthead .rt b{color:var(--accent-warm);font-weight:700;}
/* 顶部口号 "ALL FOR ZZY"：衬线暖橘小字，张真源应援口号的杂志式呈现 */
.ed-masthead .motto{position:absolute;left:0;top:10px;font-family:var(--serif);font-size:10.5px;
letter-spacing:3.6px;color:var(--accent-warm);font-weight:600;text-transform:uppercase;
display:flex;align-items:center;gap:10px;margin:0;line-height:1;}
.ed-masthead .motto::before{content:"";display:inline-block;width:22px;height:1px;background:var(--accent-warm);}
.ed-masthead .motto::after{content:"";display:inline-block;width:42px;height:1px;background:var(--accent-warm);opacity:.35;}
/* masthead 右上角：白色蝴蝶剪影 + 颗粒光点（低饱和深绿，不抢主文字） */
.ed-masthead .deco{position:absolute;right:0;top:0;width:148px;height:42px;pointer-events:none;}
.ed-masthead .deco .bf{position:absolute;right:0;top:0;width:78px;color:var(--ink-mid);opacity:.20;}
.ed-masthead .deco .sd{position:absolute;right:74px;top:10px;width:64px;color:var(--ink-mid);opacity:.55;}
.ed-masthead .deco svg{display:block;fill:currentColor;}
.ed-vol{font-size:11px;letter-spacing:2.6px;color:#888;margin-top:14px;text-transform:uppercase;}
.ed-vol b{color:var(--ink);font-weight:700;}

.ed-stat{position:relative;margin:48px 0 12px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;
padding-bottom:18px;border-bottom:1px solid var(--rule2);}
/* ed-stat 右上角：极小蝴蝶剪影，仅装饰 */
.ed-stat .deco{position:absolute;right:0;top:0;width:36px;height:18px;
color:var(--ink-mid);opacity:.16;pointer-events:none;}
.ed-stat .deco svg{display:block;width:100%;height:auto;fill:currentColor;}
.ed-stat .label{font-size:11px;letter-spacing:2.6px;color:var(--g);font-weight:700;
margin-bottom:14px;text-transform:uppercase;}
.ed-stat .num{font-family:var(--serif);font-size:clamp(56px,8vw,108px);font-weight:700;
color:var(--ink);letter-spacing:-2px;line-height:.95;font-feature-settings:"tnum";}
.ed-stat .num .raw{font-family:var(--ff);font-size:13px;color:#888;font-weight:500;
margin-left:12px;letter-spacing:0;vertical-align:middle;}
.ed-stat .sub{font-size:13px;color:#666;margin-top:14px;letter-spacing:.3px;}
.ed-stat .meta{text-align:right;font-size:11px;letter-spacing:1.5px;color:#666;
text-transform:uppercase;line-height:1.9;}
.ed-stat .meta b{color:var(--g);font-weight:700;font-family:var(--serif);
font-size:14px;letter-spacing:-.2px;text-transform:none;}

.ed-rule{height:1px;background:var(--rule);margin:0 0 36px;opacity:.92;}

.ed-charts{display:grid;grid-template-columns:1fr;gap:42px;}
.ed-chart .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);
margin-bottom:6px;letter-spacing:-.1px;}
.ed-chart .sub{font-size:10.5px;letter-spacing:1.8px;color:#888;margin-bottom:18px;
text-transform:uppercase;}
.ed-chart .frame{padding:10px 0 12px;border-bottom:.5px solid var(--rule);}

.ed-pub{margin-top:36px;padding:18px 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);}
.ed-pub .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.1px;}
.ed-pub .sub{font-size:10.5px;letter-spacing:1.8px;color:#888;margin-bottom:14px;text-transform:uppercase;}
.ed-pub .frame{padding:6px 0 12px;}

.ed-list{margin:0;padding:0;}
.ed-list-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule);}
.ed-list-head .h{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.1px;}
.ed-list-head .meta{font-size:10.5px;letter-spacing:1.8px;color:#888;text-transform:uppercase;}
.ed-list .row{display:grid;grid-template-columns:46px 1fr 120px 84px;gap:18px;
align-items:baseline;padding:13px 0;border-bottom:.5px solid var(--rule2);
transition:background .18s;}
.ed-list .row:hover{background:rgba(22,163,94,.04);}
.ed-list .no{font-family:var(--serif);font-size:13px;font-style:italic;color:#888;
font-weight:500;letter-spacing:.5px;}
.ed-list .title{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);
letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
display:block;}
.ed-list .title:hover{color:var(--g);}
.ed-list .time{font-size:11.5px;color:#666;letter-spacing:.3px;font-feature-settings:"tnum";}
.ed-list .nums{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--g);
text-align:right;font-feature-settings:"tnum";}
.ed-list-foot{padding:14px 0 0;font-size:10.5px;letter-spacing:1.8px;color:#888;text-align:center;}

/* 无后端时 nav/backend 按钮的禁用样式：仅变灰 + tooltip，不替换 DOM */
.nav-links a.disabled,.ed-xlsx-btn.disabled{
  opacity:.32;cursor:not-allowed;color:var(--muted);pointer-events:none;
}

/* 作品缩略图矩阵 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px;margin-top:14px;}
.wt{position:relative;display:block;aspect-ratio:3/4;border-radius:13px;overflow:hidden;
background:var(--gxl);border:1px solid var(--bd);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;}
.wt:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.wt.miss{background:linear-gradient(135deg,var(--gl),var(--gd));}
.wt img{width:100%;height:100%;object-fit:cover;display:block;}
.wt .scrim{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;
background:linear-gradient(transparent,rgba(10,61,36,.82));pointer-events:none;}
.wt .lk{display:flex;align-items:center;gap:3px;color:#fff;font-family:var(--serif);
font-weight:700;font-size:12.5px;font-feature-settings:"tnum";line-height:1;}
.wt .lk svg{width:10px;height:10px;fill:#fff;opacity:.92;flex:none;}
.wt .ti{margin-top:3px;font-size:10px;line-height:1.3;color:rgba(255,255,255,.85);
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wt .mt-badge{position:absolute;left:7px;top:7px;z-index:2;background:var(--ink-deep);
color:#fff;font-family:var(--serif);font-size:9px;font-weight:700;letter-spacing:.3px;
padding:3px 7px;border-radius:20px;box-shadow:0 2px 6px rgba(10,61,36,.35);}
.wt .mt-time{margin-top:3px;font-size:8.5px;line-height:1;color:rgba(255,255,255,.82);
letter-spacing:.2px;font-feature-settings:"tnum";}
/* 共创出镜作品徽标（右上角，与左上角破百万标签不重叠） */
.wt .co-badge{position:absolute;right:7px;top:7px;z-index:2;background:var(--ink-deep);
color:#fff;font-family:var(--serif);font-size:9px;font-weight:700;letter-spacing:.3px;
padding:3px 7px;border-radius:20px;box-shadow:0 2px 6px rgba(10,61,36,.35);}

/* 破百万节点：缩略图徽标 + 下方时间 */

.ed-topics{margin-top:8px;}
.ed-topics-row{display:flex;flex-wrap:wrap;gap:10px 12px;font-size:13.5px;color:var(--ink);line-height:1.5;}
.ed-topics-row .tg{display:inline-flex;align-items:baseline;gap:8px;
padding:10px 16px;border:1px solid var(--bd);border-radius:14px;background:#fff;
font-family:var(--serif);font-weight:600;color:var(--ink);transition:.18s;white-space:nowrap;}
.ed-topics-row .tg:hover{border-color:var(--g);color:var(--gd);background:var(--gxl);}
.ed-topics-row .tg.empty{opacity:.55;border-style:dashed;background:transparent;}
.ed-topics-row .tg.empty:hover{opacity:.85;}
.ed-topics-row .v{color:var(--gd);font-family:var(--ff);font-size:12px;font-weight:500;
letter-spacing:.2px;display:inline-flex;align-items:baseline;gap:4px;}
.ed-topics-row .v .lab{color:#999;margin-right:2px;font-size:11px;}
.ed-topics-row .v .sep{color:#bbb;margin:0 2px;}

/* 近一月 · 10万+ 视频统计板块 */
.ed-30d{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.ed-30d .tier{background:var(--gxl);border:1px solid var(--bd);border-radius:var(--radius-sm);
padding:18px 20px;text-align:center;}
.ed-30d .tier .n{font-family:var(--serif);font-size:40px;font-weight:700;color:var(--ink);
line-height:1;font-feature-settings:"tnum";}
.ed-30d .tier .lab{font-size:11px;letter-spacing:2px;color:var(--gd);font-weight:700;
margin-top:10px;text-transform:uppercase;}
.ed-30d .tier .sub{font-size:11.5px;color:#888;margin-top:6px;}
.ed-30d-list{margin-top:6px;}
.ed-30d-list .row{display:grid;grid-template-columns:56px 1fr 90px;gap:14px;align-items:baseline;
padding:9px 0;border-bottom:.5px solid var(--rule2);font-size:13px;}
.ed-30d-list .no{font-family:var(--serif);font-style:italic;color:#888;font-size:12.5px;}
.ed-30d-list .ti{font-family:var(--serif);font-weight:600;color:var(--ink);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ed-30d-list .ti a:hover{color:var(--g);}
.ed-30d-list .dg{text-align:right;color:var(--g);font-weight:700;font-feature-settings:"tnum";}
.ed-30d-list .dg .co{color:var(--accent-warm);font-size:10px;font-weight:600;margin-left:5px;letter-spacing:.5px;}

.ed-export{margin-top:30px;text-align:center;}
.ed-xlsx-btn{display:inline-block;padding:11px 22px;border:1.2px solid var(--bd2);
border-radius:24px;color:var(--ink);font-family:var(--serif);font-size:13px;font-weight:600;
letter-spacing:.5px;text-decoration:none;white-space:nowrap;transition:background .18s,border-color .18s;}
.ed-xlsx-btn:hover{background:var(--gxl);border-color:var(--gd);}

.foot{margin-top:42px;padding-top:24px;border-top:.5px solid var(--rule2);
text-align:center;font-size:10.5px;letter-spacing:2px;color:#888;text-transform:uppercase;}
.foot b{color:var(--ink);font-weight:700;}
/* footer 拼音标 + 应援拉丁 motto：蝴蝶意象 + 应援口号 */
.foot .motto-row{font-family:var(--serif);font-size:13px;letter-spacing:5px;
color:var(--ink-deep);font-weight:700;text-transform:uppercase;margin:0 0 6px;
display:flex;align-items:center;justify-content:center;gap:12px;}
.foot .motto-row::before,.foot .motto-row::after{content:"";display:inline-block;width:32px;height:1px;background:var(--ink-mid);opacity:.55;}
.foot .latin{font-family:var(--serif);font-style:italic;color:var(--muted);
letter-spacing:.5px;text-transform:none;font-size:11.5px;margin-top:10px;font-weight:400;}

.chart-wrap{position:relative;background:transparent;border:0;border-radius:0;padding:0;}
.chart-wrap svg circle.pt{transition:r .15s ease,stroke-width .15s ease;cursor:pointer;}
.chart-wrap svg g[data-i]:hover circle.pt{r:9;stroke-width:3;
filter:drop-shadow(0 0 6px rgba(20,124,58,.55));}
.chart-wrap svg g[data-i]:hover{outline:none;}
.chart-wrap svg g[data-i]{cursor:pointer;}

.dy-tip{position:absolute;pointer-events:none;z-index:9999;background:rgba(10,61,36,.97);color:#fff;
padding:11px 14px;border-radius:9px;font-size:12.5px;line-height:1.55;max-width:300px;white-space:normal;
box-shadow:0 12px 32px rgba(0,0,0,.32);transform:none;font-family:var(--ff);
font-weight:500;letter-spacing:.2px;}
.dy-tip .ttl{font-size:13px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:4px;
display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;}
.dy-tip .sub{font-size:11px;color:#bbf7d0;margin-bottom:4px;}
.dy-tip .meta{font-size:11.5px;color:#d6f4df;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.dy-tip .meta b{color:#fff;font-weight:700;font-feature-settings:"tnum";}
.dy-tip .meta .sep{color:rgba(187,247,208,.5);}
.dy-tip .meta .dt{color:#bbf7d0;font-feature-settings:"tnum";}
.dy-tip .hint{font-size:10.5px;color:rgba(187,247,208,.75);margin-top:5px;letter-spacing:.4px;}
.dy-tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
border:5px solid transparent;border-top-color:rgba(10,61,36,.97);}

/* 每日粉丝总量表（需求1：作品上方） */
.ed-fans{margin-top:8px;}
.ed-fans-summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 24px;
  margin:8px 0 16px;font-size:13px;color:#666;letter-spacing:.3px;}
.ed-fans-summary .lab{color:var(--gd);font-weight:700;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;margin-right:5px;}
.ed-fans-summary b{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:19px;
  font-feature-settings:"tnum";}
.ed-fans-table{width:100%;border-collapse:collapse;font-size:13px;}
.ed-fans-table th,.ed-fans-table td{padding:8px 14px;border-bottom:.5px solid var(--rule2);
  text-align:right;font-feature-settings:"tnum";}
.ed-fans-table th:first-child,.ed-fans-table td:first-child{text-align:left;color:#666;}
.ed-fans-table thead th{font-size:10.5px;letter-spacing:1.6px;color:#888;text-transform:uppercase;
  font-weight:700;border-bottom:1px solid var(--bd);}
.ed-fans-table tbody tr:hover{background:var(--gxl);}
.ed-fans-table .pos{color:var(--g);font-weight:700;}
.ed-fans-table .neg{color:#d8643a;font-weight:700;}
.ed-fans-note{margin-top:10px;font-size:10.5px;letter-spacing:1.4px;color:#999;}

/* 作品表：序列号 + 共创浅黄底（需求2） */
.wt-table td.seq{font-family:var(--serif);font-weight:700;color:var(--gd);
  text-align:center;width:44px;font-feature-settings:"tnum";}
.wt-table thead th.seq{color:#999;}
.wt-table tr.co-row{background:#fffbe6;}
.wt-table tr.co-row:hover{background:#fff6cc;}
.wt-table .co-tag{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:10px;
  background:#f6e07a;color:#7a5b00;font-size:10px;font-weight:700;letter-spacing:.5px;
  vertical-align:middle;font-family:var(--ff);}

@media (max-width:760px){
.wrap{padding:18px 16px 42px;}
.ed-stat{grid-template-columns:1fr;gap:14px;}
.ed-stat .meta{text-align:left;}
.ed-stat .num{font-size:54px;}
.ed-charts{grid-template-columns:1fr;gap:28px;}
.ed-list .row{grid-template-columns:38px 1fr 64px;gap:10px;}
.ed-list .time{display:none;}
.wall{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;}
.ed-30d{grid-template-columns:1fr 1fr 1fr;gap:10px;}
.ed-30d .tier{padding:14px 10px;}
.ed-30d .tier .n{font-size:32px;}
.ms-scale span{font-size:7px;}
.ms-scale,.ms-bar{margin-left:14px;margin-right:14px;}
.ed-pub{margin-top:28px;}
.ed-masthead{flex-direction:column;gap:8px;align-items:flex-start;}
.ed-masthead .rt{text-align:left;}
.ed-list-head{flex-direction:column;align-items:flex-start;gap:4px;}
}

.ed-pub-filter{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:8px 0 14px;font-size:12.5px;}
.ed-pub-filter .presets{display:flex;gap:6px;}
.ed-pub-filter .presets button{padding:5px 12px;border:1px solid #d8efe0;border-radius:18px;background:#fff;color:#14342a;font-size:12px;font-weight:500;cursor:pointer;transition:.18s;font-family:var(--ff);}
.ed-pub-filter .presets button:hover{border-color:#15803d;color:#15803d;background:#f4faf6;}
.ed-pub-filter .presets button.active{background:#15803d;color:#fff;border-color:#15803d;}
.ed-pub-filter .custom{display:flex;align-items:center;gap:8px;color:#666;font-size:12px;}
.ed-pub-filter .custom input[type=date]{padding:5px 9px;border:1px solid #d8efe0;border-radius:8px;font-size:12px;color:#14342a;background:#fff;font-family:var(--ff);}
.ed-pub-filter .custom input[type=date]:focus{outline:none;border-color:#15803d;}
.ed-pub-filter .arrow{color:#6b9080;font-weight:600;}
.ed-pub-filter .count{margin-left:auto;font-size:11px;letter-spacing:1.4px;color:#888;text-transform:uppercase;font-feature-settings:"tnum";}
.ed-pub-filter .count b{color:#16a34a;font-weight:700;font-family:var(--serif);}

      } else {

  // ---------------- 作品缩略图卡（含破百万标签） ----------------

  // ---------------- 话题 chips ----------------
  function boardChips(items, limit) {
    limit = limit || 12;
    if (!items || !items.length) return '<div class="muted">暂无数据</div>';
    var out = "";
    for (var i = 0; i < Math.min(items.length, limit); i++) {
      var it = items[i];
      var extra = boardExtraStr(it.extra);
      var name = it.name;

      out += '<a class="tg" href="' + url + '" target="_blank" rel="noopener" title="在抖音查看 ' + esc(name) + '"># ' +
        esc(name) + '<span class="v">' + (extra || "—") + '</span></a>';
    }
    return '<div class="ed-topics-row">' + out + '</div>';

  // ---------------- 辅助：时间筛选 / 作品表格 / 单集节点 ----------------
  var RANGES = { "24h": 1, "7d": 7, "30d": 30, all: 1e9 };
  var RANGE_LABEL = { "24h": "当日", "7d": "近7日", "30d": "近30日", all: "全部" };
  var currentRange = "7d";
  var FULL_DATA = null;  // 用于重渲染

  function rangeBarHTML() {
    var items = [["24h","当日"],["7d","7日"],["30d","30日"],["all","全部"]];
    return '<div class="pl-range" style="margin-left:auto">' +
      items.map(function (kv) {
        return '<button data-r="' + kv[0] + '" class="' + (kv[0] === currentRange ? "active" : "") + '">' + kv[1] + '</button>';
      }).join("") + '</div>';
  }

  // 筛选数据：按 labels 时间（profile_hourly 收集时间）切窗
  function sliceByRange(arrs) {
    if (currentRange === "all" || !FULL_DATA || !FULL_DATA.labels) return arrs;
    var cut = Date.now() - (RANGES[currentRange] || 7) * 86400000;
    var keepIdx = [];
    for (var i = 0; i < FULL_DATA.labels.length; i++) {
      var t = new Date(FULL_DATA.labels[i]).getTime();
      if (t >= cut) keepIdx.push(i);
    }
    if (keepIdx.length < 2) return arrs;  // 太短就别过滤
    return arrs.map(function (a) {
      var out = new Array(keepIdx.length);
      for (var k = 0; k < keepIdx.length; k++) out[k] = a[keepIdx[k]];
      return out;
    });
  }

  function regenTrendCharts() {
    if (!FULL_DATA || !FULL_DATA.labels || !FULL_DATA.labels.length) return;
    var labels = FULL_DATA.labels;
    var fansVals = FULL_DATA.followers || [];
    var likedVals = FULL_DATA.liked || [];
    var sliced = sliceByRange([labels.slice(), fansVals.slice(), likedVals.slice()]);
    var lbl = sliced[0], fv = sliced[1], lv = sliced[2];
    var xs = lbl.map(function (l) { return (l.indexOf(" ") >= 0) ? l.split(" ")[0].slice(5) : l; });
    var fansTitles = lbl.map(function (l, i) {
      return l + "\n粉丝 " + humanize(fv[i]) + "（" + fmtSigned(fv[i] - fv[0]) + "）";
    });
    var likedTitles = lbl.map(function (l, i) {
      return l + "\n获赞 " + humanize(lv[i]) + "（" + fmtSigned(lv[i] - lv[0]) + "）";
    });
    var c_fans = svgLine(xs, fv, { w: 1140, tickEvery: 5, color: GREEN_D, relative_start: true, point_titles: fansTitles, chart_id: "chart-fans" });
    var c_liked = svgLine(xs, lv, { w: 1140, tickEvery: 5, color: GREEN_BR, relative_start: true, point_titles: likedTitles, chart_id: "chart-liked" });
    var fe = document.getElementById("chart-fans-frame");

  // 作品表格（可排序 + 固定高度滚动；列：#|发布时间|标题|最新点赞|30天内新增|近7日新增|每日）
  var worksSort = { col: "publish_time", dir: "desc" }; // 默认：按发布时间降序（最新日期在最上面）
  var worksDateFilter = { start: null, end: null };     // 全部作品：日期区间筛选（YYYY-MM-DD）
  var SORT_KEYS = {
    publish_time: function (r) { return r.create_time || 0; },
    latest:       function (r) { return r.latest || 0; },
    thirty_day_new: function (r) { return r.thirty_day_new || 0; },
    seven_day_new:  function (r) { return r.seven_day_new || 0; }
  };
  // 列头位置 → 排序 key（其余列不参与排序）；首列为 # 序列号（不可排序）
  var COL_INDEX_TO_KEY = [null, "publish_time", null, "latest", "thirty_day_new", "seven_day_new"];

  // 发布时间补上年份：作品跨 2025/2026，仅显示 MM-DD 时分不清属于哪一年
  function publishYearStr(r) {
    var s = r.publish_time_str || "";
    if (!s) return "—";
    if (!r.create_time) return s;
    try {
      return new Date(r.create_time * 1000).getFullYear() + "-" + s;
    } catch (err) { return s; }
  }

  function renderWorksTableHTML() {
    var wt = FULL_DATA && FULL_DATA.works_table;
    if (!wt || !wt.rows || !wt.rows.length)
      return '<div style="padding:30px;color:var(--muted);text-align:center">尚无作品数据</div>';
    var keyFn = SORT_KEYS[worksSort.col] || SORT_KEYS.publish_time;
    var dirMul = worksSort.dir === "asc" ? 1 : -1;
    var rows = wt.rows.slice().sort(function (a, b) { return (keyFn(a) - keyFn(b)) * dirMul; });

    // 日期区间筛选：dayIdx 保存「筛选后列 → 原始 days 索引」的映射
    var allDays = wt.days || [];
    var dayIdx = [];
    for (var di = 0; di < allDays.length; di++) {
      var dd = allDays[di];
      if (worksDateFilter.start && dd < worksDateFilter.start) continue;
      if (worksDateFilter.end && dd > worksDateFilter.end) continue;
      dayIdx.push(di);
    }
    dayIdx.reverse(); // 每日列按日期倒序：最新日期在最左，往右为更早

    // 年份大表头：筛选后的每日列按自然年归组（跨年时用 colspan 分开标注）
    var yearSpans = [], curYear = null, curCount = 0;
    for (var yi = 0; yi < dayIdx.length; yi++) {
      var y = (allDays[dayIdx[yi]] || "").slice(0, 4);
      if (y === curYear) { curCount++; }
      else {
        if (curYear) yearSpans.push({ year: curYear, count: curCount });
        curYear = y; curCount = 1;
      }
    }

      '<th colspan="6" class="wt-year-spacer"></th>' +

    // 基础列（前 6 列，可排序）
    var baseHeads = (wt.headers || []).slice(0, 6);
    var baseHeadHtml = baseHeads.map(function (h, i) {
      var key = COL_INDEX_TO_KEY[i];

      if (key) {
        var isCur = (worksSort.col === key);

    // 每日列（按筛选结果，只渲染区间内的日期）
    var dayHeadHtml = dayIdx.map(function (origIdx) {
      var label = (wt.headers || [])[6 + origIdx] || (allDays[origIdx] || "").slice(5);
      return '<th style="text-align:right">' + esc(label) + '</th>';
    }).join("");

    var headHtml = baseHeadHtml + dayHeadHtml;

    var rowsHtml = rows.map(function (r) {
      var seq = (r.seq || 0);
      var coTag = r.is_co
        ? ' <span class="co-tag">共创</span>'

          esc(r.title.length > 32 ? r.title.slice(0, 32) + "…" : r.title) + '</a>' + coTag + '</td>',
        '<td style="text-align:right"><b>' + humanize(r.latest) + '</b></td>',
        '<td style="text-align:right;color:var(--gd)">' + (r.thirty_day_new ? "+" + humanize(r.thirty_day_new) : "—") + '</td>',
        '<td style="text-align:right;color:var(--gd)">' + (r.seven_day_new ? "+" + humanize(r.seven_day_new) : "—") + '</td>'
      ];
      dayIdx.forEach(function (origIdx) {
        var v = (r.per_day || [])[origIdx];

              (v > 0 ? "+" : "") + humanize(v) + '</td>');

      var cls = r.is_co ? ' class="co-row"' : "";
      return '<tr' + cls + '>' + cells.join("") + '</tr>';
    }).join("");

    return '<table class="wt-table"><thead>' + yearRowHtml +
           '<tr>' + headHtml + '</tr></thead>' +

  }

  // 单集节点（每百万 → 紧凑标签云 4 列，按作品分组，按最近达成时间排序，新达成标 "新"）
  function milestonesHTML(ms) {
    if (!ms || !ms.groups || !ms.groups.length)
      return '<div class="ms-frame"><div class="ms-empty">尚无达成节点（需要点赞 ≥ 100 万的作品）</div></div>';
    var groupsHtml = ms.groups.map(function (g) {
      var tags = g.milestones.map(function (m) {
        var label = m.threshold >= 1e8
          ? (m.threshold / 1e8).toFixed(1).replace(/\.0$/, "") + "亿"
          : Math.round(m.threshold / 1e4) + "万";
        // 节点达成时间：MM-DD HH:MM（每整点抓一次，按实际抓到的快照）
        var ts = (m.reached_at || "");
        var dateText = ts.length >= 16 ? ts.slice(5, 16) : ts;  // "09-01 04:11"
        var fullTs = ts;
        var newBadge = m.is_new ? ' <span class="ms-new">new</span>' : "";
        return '<span class="ms-tag' + (m.is_new ? " new" : "") + '" title="' + esc(fullTs) + '">' +
          '<span class="ms-num">' + esc(label) + '</span>' +
          '<span class="ms-date">' + esc(dateText) + newBadge + '</span>' +
          '</span>';
      }).join("");
      return '<div class="ms-group">' +
        '<div class="ms-title"><a href="' + esc(g.share_url || "https://www.douyin.com/") +

        '<div class="ms-tags">' + tags + '</div></div>';

    return '<div class="ms-frame">' + groupsHtml + '</div>';

  // ---------------- 发布图渲染（独立函数，供筛选条复用重渲染） ----------------
  function renderPubChart(pubSubset) {
    if (!pubSubset || !pubSubset.length) return '<div class="chart-empty">该时间范围内无作品</div>';
    var pub_x = pubSubset.map(function (p) { return p.t.slice(5); });
    var pubDigg = pubSubset.map(function (p) { return p.digg; });
    var pubMeta = pubSubset.map(function (p) {
      return { title: (p.desc || "").slice(0, 40) || (p.aweme_id || "").slice(0, 8),
               digg: p.digg, date: p.t, href: p.url || "" };
    });
    var pubHrefs = pubSubset.map(function (p) { return p.url || ""; });
    var weeklyTicks = [];
    var _seen = {};
    for (var _wi = 0; _wi < pubSubset.length; _wi++) {
      var _s = String(pubSubset[_wi].t || "");
      var _ms = Date.parse(_s.indexOf(" ") > 0 ? _s.replace(" ", "T") : _s);
      if (isNaN(_ms)) _ms = (parseInt(_s, 10) || 0) * 1000;
      var _d = new Date(_ms);
      var _dow = _d.getUTCDay();
      var _monOff = (_dow + 6) % 7;
      var _monMs = _ms - _monOff * 86400000;
      var _monKey = Math.floor(_monMs / 86400000);
      if (!_seen[_monKey]) _seen[_monKey] = { lastI: _wi, monMs: _monMs };
      else _seen[_monKey].lastI = _wi;
    }
    Object.keys(_seen).map(Number).sort(function (a, b) { return a - b; }).forEach(function (k) {
      var _m = _seen[k], _md = new Date(_m.monMs);
      var _mm = _md.getUTCMonth() + 1, _dd = _md.getUTCDate();
      var _lbl = (_mm < 10 ? "0" : "") + _mm + "-" + (_dd < 10 ? "0" : "") + _dd;
      weeklyTicks.push({ i: _m.lastI, label: _lbl });
    });
    return svgLine(pub_x, pubDigg,
      { color: GREEN_D, w: 1140, padTop: 34, padBottom: 46, labelAll: true, yStep: 1e6,
        xticks: weeklyTicks, xRotate: -30,
        point_meta: pubMeta, point_hrefs: pubHrefs, chart_id: "chart-pub" });
  }

  // ---------------- 客户端导出 Excel（无需后端） ----------------
  function ensureXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function (resolve, reject) {
      var urls = [
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
        "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"
      ];
      var i = 0;
      function tryLoad() {
        if (i >= urls.length) { reject(new Error("无法加载 Excel 库")); return; }
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = function () { window.XLSX ? resolve(window.XLSX) : tryLoad(); };
        s.onerror = tryLoad;
        document.head.appendChild(s);
      }
      tryLoad();
    });
  }
  function fmtDateTime(unix) {
    if (!unix) return "";
    var t = parseInt(unix, 10); if (isNaN(t)) return "";
    var d = new Date(t * 1000);
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }




  // ---------------- 初始化 ----------------
  var root = document.getElementById("root");
  if (!root) return;

  var LATEST_DATA = null;
  function paint(d) {
    LATEST_DATA = d;
    root.innerHTML = renderDashboard(d);
    applyBackendState();
    // 时间筛选按钮（影响趋势图）
    root.querySelectorAll(".ed-range-row .pl-range button").forEach(function (b) {
      b.addEventListener("click", function () {
        currentRange = b.getAttribute("data-r");
        // 重绘范围栏按钮 active 态
        root.querySelectorAll(".ed-range-row .pl-range button").forEach(function (x) {
          x.classList.toggle("active", x.getAttribute("data-r") === currentRange);
        });
        regenTrendCharts();
      });
    });

    // 发布图筛选（按日期范围重渲染发布图）
    (function () {
      var fullPub = (d && d.publish) || [];
      var filterEl = root.querySelector(".ed-pub-filter");
      if (!filterEl || !fullPub.length) return;
      function parseMs(s) {
        if (!s) return NaN;
        var t = String(s);
        var ms = Date.parse(t.indexOf(" ") > 0 ? t.replace(" ", "T") : t);
        if (isNaN(ms)) ms = (parseInt(s, 10) || 0) * 1000;
        return ms;
      }
      var state = { mode: "all", days: 0, start: "", end: "" };
      function apply() {
        var ref = parseMs(fullPub[fullPub.length - 1].t);
        var sMs = null, eMs = null;
        if (state.mode === "days") {
          eMs = ref + 86400000;
          sMs = ref - state.days * 86400000;
        } else if (state.mode === "custom") {
          if (state.start) sMs = parseMs(state.start);
          if (state.end) eMs = parseMs(state.end) + 86400000 - 1;
        }
        var filt = fullPub.filter(function (p) {
          var t = parseMs(p.t);
          if (sMs != null && t < sMs) return false;
          if (eMs != null && t > eMs) return false;
          return true;
        });
        var frame = root.querySelector("#chart-pub-frame");
        if (frame) frame.innerHTML = renderPubChart(filt);
        var cnt = root.querySelector("#pub-count");
        if (cnt) cnt.textContent = "共 " + filt.length + " 个作品";
      }
      filterEl.querySelectorAll(".presets button").forEach(function (b) {
        b.addEventListener("click", function () {
          filterEl.querySelectorAll(".presets button").forEach(function (x) {
            x.classList.toggle("active", x === b);
          });
          var r = b.getAttribute("data-r");
          if (r === "all") state.mode = "all";
          else { state.mode = "days"; state.days = parseInt(r); }
          apply();
        });
      });
      var sI = root.querySelector("#pub-start");
      var eI = root.querySelector("#pub-end");
      function onCust() {
        filterEl.querySelectorAll(".presets button").forEach(function (x) { x.classList.remove("active"); });
        state.mode = "custom";
        state.start = sI ? (sI.value || "") : "";
        state.end = eI ? (eI.value || "") : "";
        apply();
      }
      if (sI) sI.addEventListener("change", onCust);
      if (eI) eI.addEventListener("change", onCust);
    })();
  }

  // 首屏：用构建时内联的数据，避免白屏
  paint(window.INITIAL_DATA || { labels: [], post_cards: [], mode: "awaiting-config", post_count: 0, head: {} });

  // tooltip（事件委托，重渲染安全）
  var tipLayer = document.createElement("div");
  tipLayer.className = "dy-tip";
  tipLayer.style.display = "none";
  document.body.appendChild(tipLayer);

  function showTip(g, ev) {
    var ds = g.dataset || {};
    if (!ds.tt && !ds.dg) return false;
    var subHtml = "";
    if (ds.sub) subHtml = '<div class="sub">' + esc(ds.sub) + '</div>';
    var title = ds.tt ? '<div class="ttl">' + esc(ds.tt) + '</div>' : '';
    var meta = '';
    if (ds.dg) meta += '<span class="dl">点赞 <b>' + humanize(Number(ds.dg) || 0) + '</b></span>';
    if (ds.dt) meta += (meta ? '<span class="sep">·</span>' : '') + '<span class="dt">' + esc(ds.dt) + '</span>';
    var metaHtml = meta ? '<div class="meta">' + meta + '</div>' : '';
    var urlHint = ds.href ? '<div class="hint">→ 在抖音打开</div>' : '';
    tipLayer.innerHTML = title + subHtml + metaHtml + urlHint;
    tipLayer.style.display = "block";
    var wrap = g.closest(".chart-wrap") || document.body;
    var r = g.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    var tw = tipLayer.offsetWidth, th = tipLayer.offsetHeight;
    var left = (r.left + r.width / 2 - wr.left);
    var top = (r.top - wr.top - th - 10);
    // 防止超出 wrap 左/右边界
    var leftMin = 6, leftMax = wr.width - tw - 6;
    if (left < leftMin) left = leftMin;
    if (left > leftMax) left = leftMax;
    if (top < 0) top = (r.bottom - wr.top + 10);  // 点在上方时翻转到下方
    tipLayer.style.left = left + "px";
    tipLayer.style.top = top + "px";
    return true;
  }

  function hideTip(g) { tipLayer.style.display = "none"; }

  document.addEventListener("mouseover", function (ev) {
    var g = ev.target.closest ? ev.target.closest("svg [data-i]") : null;
    if (g) showTip(g, ev); else hideTip();
  });
  document.addEventListener("mouseout", function (ev) {
    var g = ev.target.closest ? ev.target.closest("svg [data-i]") : null;
    if (g) hideTip();
  });
  document.addEventListener("mousemove", function (ev) {
    var g = ev.target.closest ? ev.target.closest("svg [data-i]") : null;
    if (g) showTip(g, ev);
  });

  // 后端探测：本地服务（有后端）真实跳转；无后端（GitHub/CloudStudio）置灰 backend 链接
  var BACKEND_OK = null;
  function probe() {
    return fetch("/api/users").then(function (r) { return r.json(); })
      .then(function (j) { return !!(j && j.ok); })
      .catch(function () { return false; });
  }
  function showDisabled(a, msg) {
    if (!a) return;
    a.classList.add("disabled");
    a.setAttribute("title", msg);
    a.setAttribute("aria-disabled", "true");
  }
  // 每次重渲染后根据探测结果置灰 backend 链接（无需后端的功能保持可用）
  function applyBackendState() {
    if (BACKEND_OK === false) {
      var bs = document.querySelectorAll('a[data-nav="backend"]');
      for (var i = 0; i < bs.length; i++)
        showDisabled(bs[i], "需在本机运行 python src/server.py 后访问 localhost 才能使用（静态托管站无后端）");
    }
  }
  // 点击事件委托（重渲染安全）
  document.addEventListener("click", function (e) {
    // 排序表头
    var th = e.target.closest ? e.target.closest(".wt-table th.sortable") : null;
    if (th) {
      var col = th.getAttribute("data-col");
      if (worksSort.col === col) {
        worksSort.dir = (worksSort.dir === "desc") ? "asc" : "desc";
      } else {
        worksSort.col = col;
        worksSort.dir = "desc";
      }
      var host = document.getElementById("wt-table-host");
      if (host) host.innerHTML = renderWorksTableHTML();
      return;
    }
    // 作品表日期区间筛选（支持单日：起止同一天）
    if (e.target && e.target.id === "wt-date-apply") {
      var sIn = document.getElementById("wt-date-start");
      var eIn = document.getElementById("wt-date-end");
      worksDateFilter.start = (sIn && sIn.value) || null;
      worksDateFilter.end = (eIn && eIn.value) || null;
      var hostF = document.getElementById("wt-table-host");
      if (hostF) hostF.innerHTML = renderWorksTableHTML();
      return;
    }
    if (e.target && e.target.id === "wt-date-reset") {
      worksDateFilter = { start: null, end: null };
      var sIn2 = document.getElementById("wt-date-start");
      var eIn2 = document.getElementById("wt-date-end");
      if (sIn2) sIn2.value = "";
      if (eIn2) eIn2.value = "";
      var hostR = document.getElementById("wt-table-host");
      if (hostR) hostR.innerHTML = renderWorksTableHTML();
      return;
    }
    // 下载 Excel（作品表）
    var xl = e.target.closest ? e.target.closest('[data-act="export-all"]') : null;
    if (xl) { e.preventDefault(); exportAllXlsx(xl); return; }

    var a = e.target.closest ? e.target.closest("a[data-nav]") : null;
    if (!a) return;
    var nav = a.getAttribute("data-nav");
    if (nav === "reload") { e.preventDefault(); location.reload(); return; }
    if (nav === "xlsx") { e.preventDefault(); exportAllXlsx(a); return; }
    if (nav === "backend") {
      e.preventDefault();
      if (BACKEND_OK) { window.location.href = a.getAttribute("href"); }
      else if (BACKEND_OK === false) { /* 已置灰，无需处理 */ }
      else { probe().then(function (ok) { BACKEND_OK = ok; applyBackendState(); if (ok) window.location.href = a.getAttribute("href"); }); }
    }
  });
  probe().then(function (ok) { BACKEND_OK = ok; applyBackendState(); });

  // 实时拉取最新 data.json（同源 → jsDelivr → raw），成功则覆盖重渲染
  var DATA_SOURCES = [
    "data.json",
    "https://cdn.jsdelivr.net/gh/kylinzzy/zzy-douyin-monitor@main/data.json",
    "https://raw.githubusercontent.com/kylinzzy/zzy-douyin-monitor/main/data.json"
  ];
  function fetchLatest(i) {
    i = i || 0;
    if (i >= DATA_SOURCES.length) return;
    fetch(DATA_SOURCES[i], { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (j) {
      paint(j);
    }).catch(function () {
      fetchLatest(i + 1);
    });
  }
  fetchLatest();
})();
